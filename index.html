<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DOPPELGÄNGER: a local-first Go training lab that studies one player's games with KataGo." />
    <meta name="theme-color" content="#ffdcb8" />
    <script>
      // Paint the saved background theme (lib/themes.ts, localStorage dop.theme) from the very first frame,
      // and give the browser bar the matching colour.
      (function () {
        var d = document.documentElement;
        var t = 'sunrise';
        try {
          var saved = localStorage.getItem('dop.theme');
          if (saved === 'sakura' || saved === 'mist' || saved === 'aurora') t = saved;
        } catch (e) {}
        d.dataset.theme = t;
        if (t === 'aurora') d.style.colorScheme = 'dark';
        var bar = { sunrise: '#ffdcb8', sakura: '#f1c9da', mist: '#d9dfea', aurora: '#0f1a3e' }[t];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bar);
      })();
    </script>
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DOPPELGÄNGER · Go training lab</title>
    <!-- The splash's rules are a renamed copy of the loader in src/styles/brand.css: node tools/brand/sync-splash.mjs -->
    <style id="splash-css">:root,[data-theme='sunrise']{--sp-bg:radial-gradient(130% 90% at 50% 34%,#fff4e2 0%,#ffdcb8 46%,#f7c39c 100%);--sp-ink:#6b4a33}[data-theme='sakura']{--sp-bg:radial-gradient(130% 90% at 50% 34%,#fdebf1 0%,#f1c9da 46%,#cf9dbd 100%);--sp-ink:#6f4459}[data-theme='mist']{--sp-bg:radial-gradient(130% 90% at 50% 34%,#f4f6fb 0%,#d9dfea 48%,#b3bed3 100%);--sp-ink:#3c4863}[data-theme='aurora']{--sp-bg:radial-gradient(130% 90% at 50% 34%,#1d2c5c 0%,#0f1a3e 48%,#070c22 100%);--sp-ink:#cdd8f6}#dop-splash{--sp-period:2.2s;display:grid;place-items:center;align-content:center;gap:18px;width:100%;height:100%;min-height:calc(var(--sp-size,112px) + 80px);color:var(--sp-ink);text-align:center;pointer-events:none}#dop-splash.is-overlay{position:fixed;inset:0;z-index:1000;height:auto;background:var(--sp-bg);pointer-events:auto}.sp-mark{width:var(--sp-size,112px);height:var(--sp-size,112px);overflow:visible;filter:drop-shadow(0 10px 18px rgba(120,50,20,0.18))}[data-theme='aurora'] .sp-mark{filter:drop-shadow(0 10px 22px rgba(0,0,0,0.45))}.sp-label{font:500 13px/1.3 var(--font,system-ui,sans-serif);letter-spacing:0.14em;text-transform:uppercase;opacity:0.8}.sp-orbit{transform-box:view-box;transform-origin:32px 32px}.sp-drift,.sp-self,.sp-lens,.sp-cut,.sp-glow,.sp-ripple{transform-box:fill-box;transform-origin:center}.sp-arc{stroke-dasharray:100 110;stroke-dashoffset:0}.sp-shine,.sp-ripple{opacity:0}@media (prefers-reduced-motion:no-preference){.sp-orbit,.sp-self,.sp-drift,.sp-lens,.sp-cut,.sp-glow,.sp-arc,.sp-shine,.sp-ripple,.sp-label{animation-duration:var(--sp-period);animation-iteration-count:infinite;animation-delay:var(--sp-delay,0s);animation-fill-mode:both}.sp-orbit{animation-name:sp-orbit}.sp-self{animation-name:sp-self}.sp-drift.sp-black{animation-name:sp-drift-black}.sp-drift.sp-white{animation-name:sp-drift-white}.sp-lens,.sp-cut{animation-name:sp-lens}.sp-glow{animation-name:sp-glow}.sp-arc{animation-name:sp-arc}.sp-shine{animation-name:sp-shine}.sp-ripple{animation-name:sp-ripple}.sp-label{animation-name:sp-label}}@keyframes sp-orbit{0%{transform:rotate(-240deg);animation-timing-function:cubic-bezier(0.25,0.55,0.3,1)}38%,80%{transform:rotate(0deg);animation-timing-function:cubic-bezier(0.6,0,0.8,0.5)}100%{transform:rotate(120deg)}}@keyframes sp-self{0%{transform:rotate(240deg);animation-timing-function:cubic-bezier(0.25,0.55,0.3,1)}38%,80%{transform:rotate(0deg);animation-timing-function:cubic-bezier(0.6,0,0.8,0.5)}100%{transform:rotate(-120deg)}}@keyframes sp-drift-black{0%{transform:translate(-12px,12px) scale(0.55);opacity:0;animation-timing-function:ease-out}12%{transform:translate(-11px,11px) scale(0.8);opacity:1;animation-timing-function:cubic-bezier(0.55,0,0.35,1)}35%{transform:translate(0.9px,-0.9px) scale(1.03);animation-timing-function:ease-in-out}43%,80%{transform:none;opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.6,1)}90%{transform:translate(-8px,8px) scale(0.8);opacity:0.9;animation-timing-function:ease-in}100%{transform:translate(-12px,12px) scale(0.55);opacity:0}}@keyframes sp-drift-white{0%{transform:translate(12px,-12px) scale(0.55);opacity:0;animation-timing-function:ease-out}12%{transform:translate(11px,-11px) scale(0.8);opacity:1;animation-timing-function:cubic-bezier(0.55,0,0.35,1)}35%{transform:translate(-0.9px,0.9px) scale(1.03);animation-timing-function:ease-in-out}43%,80%{transform:none;opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.6,1)}90%{transform:translate(8px,-8px) scale(0.8);opacity:0.9;animation-timing-function:ease-in}100%{transform:translate(12px,-12px) scale(0.55);opacity:0}}@keyframes sp-lens{0%,33%{transform:scale(0.2);opacity:0;animation-timing-function:cubic-bezier(0.3,1.5,0.5,1)}44%{transform:scale(1);opacity:1}78%{transform:scale(1);opacity:1;animation-timing-function:ease-in}86%,100%{transform:scale(0.5);opacity:0}}@keyframes sp-glow{0%,32%{transform:scale(0.6);opacity:0;animation-timing-function:cubic-bezier(0.2,0.8,0.2,1)}46%{transform:scale(1.08);opacity:1;animation-timing-function:ease-in-out}66%{transform:scale(1);opacity:0.7}82%{transform:scale(1);opacity:0.55;animation-timing-function:ease-in}100%{transform:scale(0.6);opacity:0}}@keyframes sp-arc{0%,12%{stroke-dashoffset:105;animation-timing-function:cubic-bezier(0.45,0,0.2,1)}52%,78%{stroke-dashoffset:0;animation-timing-function:cubic-bezier(0.6,0,0.6,1)}100%{stroke-dashoffset:-105}}@keyframes sp-shine{0%,50%{transform:translateX(-40px);opacity:0;animation-timing-function:cubic-bezier(0.45,0,0.35,1)}53%{opacity:1}70%{opacity:1}73%,100%{transform:translateX(40px);opacity:0}}@keyframes sp-ripple{0%,37%{transform:scale(0.7);opacity:0;animation-timing-function:cubic-bezier(0.15,0.6,0.3,1)}40%{opacity:0.5}58%,100%{transform:scale(2.3);opacity:0}}@keyframes sp-label{0%,100%{opacity:0.55}50%{opacity:0.95}}@media (prefers-reduced-motion:reduce){.sp-glow{animation:sp-breathe 2.4s ease-in-out infinite !important}}@keyframes sp-breathe{0%,100%{opacity:0.45}50%{opacity:1}}</style>
  </head>
  <body>
    <div id="root">
      <!-- Shown from the first paint until React mounts; mirrors <BrandLoader overlay> (components/Brand.tsx). -->
      <div id="dop-splash" class="is-overlay" role="status">
        <svg class="sp-mark" viewBox="0 0 64 64" width="112" height="112" aria-hidden="true">
          <defs>
            <linearGradient id="sp-s" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54"><stop offset="0" stop-color="#ffc46a" /><stop offset=".5" stop-color="#ff8e52" /><stop offset="1" stop-color="#f0566f" /></linearGradient>
            <linearGradient id="sp-l" gradientUnits="userSpaceOnUse" x1="25" y1="24" x2="40" y2="41"><stop offset="0" stop-color="#ffc46a" /><stop offset=".55" stop-color="#ff8e52" /><stop offset="1" stop-color="#f0566f" /></linearGradient>
            <radialGradient id="sp-g" gradientUnits="userSpaceOnUse" cx="32" cy="32" r="31"><stop offset="0" stop-color="#ff8e52" stop-opacity=".42" /><stop offset=".55" stop-color="#ff8e52" stop-opacity=".14" /><stop offset="1" stop-color="#ff8e52" stop-opacity="0" /></radialGradient>
            <radialGradient id="sp-b" cx=".36" cy=".3" r=".78"><stop offset="0" stop-color="#7a808d" /><stop offset=".42" stop-color="#25282f" /><stop offset="1" stop-color="#040405" /></radialGradient>
            <radialGradient id="sp-w" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fff" /><stop offset=".66" stop-color="#f3eee6" /><stop offset="1" stop-color="#cdc3b4" /></radialGradient>
            <linearGradient id="sp-rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45" /><stop offset=".5" stop-color="#fff" stop-opacity=".05" /><stop offset="1" stop-color="#fff" stop-opacity=".18" /></linearGradient>
            <linearGradient id="sp-rw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8ad9c" stop-opacity=".15" /><stop offset="1" stop-color="#8a7c68" stop-opacity=".7" /></linearGradient>
            <radialGradient id="sp-h"><stop offset="0" stop-color="#fff" stop-opacity=".55" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
            <linearGradient id="sp-x"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".7" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
            <mask id="sp-m" maskUnits="userSpaceOnUse" x="-32" y="-32" width="128" height="128"><rect x="-32" y="-32" width="128" height="128" fill="#fff" /><path class="sp-cut" d="M23.1 23.1A15.5 15.5 0 0 1 40.9 40.9A15.5 15.5 0 0 1 23.1 23.1Z" fill="#000" stroke="#000" stroke-width="3" /></mask>
            <mask id="sp-o" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path class="sp-arc" d="M18 7.75A28 28 0 0 1 56.25 46" pathLength="100" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" /><path class="sp-arc" d="M46 56.25A28 28 0 0 1 7.75 18" pathLength="100" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" /></mask>
            <clipPath id="sp-c"><circle cx="25.6" cy="38.4" r="15.5" /><circle cx="38.4" cy="25.6" r="15.5" /></clipPath>
          </defs>
          <circle class="sp-glow" cx="32" cy="32" r="31" fill="url(#sp-g)" />
          <path d="M17 6.02A30 30 0 0 1 57.98 47L56.8 46.32A30 30 0 0 0 17.68 7.2ZM47 57.98A30 30 0 0 1 6.02 17L7.2 17.68A30 30 0 0 0 46.32 56.8Z" fill="url(#sp-s)" mask="url(#sp-o)" />
          <g mask="url(#sp-m)">
            <g class="sp-orbit"><g class="sp-drift sp-black"><g class="sp-self"><circle cx="25.6" cy="38.4" r="15.5" fill="url(#sp-b)" /><circle cx="25.6" cy="38.4" r="15.1" fill="none" stroke="url(#sp-rb)" stroke-width=".8" /><ellipse cx="20" cy="31.9" rx="5.9" ry="3.7" transform="rotate(-35 20 31.9)" fill="url(#sp-h)" opacity=".5" /></g></g></g>
            <g class="sp-orbit"><g class="sp-drift sp-white"><g class="sp-self"><circle cx="38.4" cy="25.6" r="15.5" fill="url(#sp-w)" /><circle cx="38.4" cy="25.6" r="15.1" fill="none" stroke="url(#sp-rw)" stroke-width=".8" /></g></g></g>
          </g>
          <path class="sp-lens" d="M23.1 23.1A15.5 15.5 0 0 1 40.9 40.9A15.5 15.5 0 0 1 23.1 23.1Z" fill="url(#sp-l)" />
          <circle class="sp-ripple" cx="32" cy="32" r="12" fill="none" stroke="url(#sp-s)" stroke-width=".9" />
          <g clip-path="url(#sp-c)"><g transform="rotate(28 32 32)"><rect class="sp-shine" x="25" y="-12" width="14" height="88" fill="url(#sp-x)" /></g></g>
        </svg>
        <span class="sp-label">Opening your lab…</span>
      </div>
    </div>
    <script>
      // Run the splash on the clock BrandLoader uses (time since navigation), so the hand-over does not jump.
      document.documentElement.style.setProperty('--sp-delay', -Math.round(performance.now() % 2200) + 'ms');
    </script>
    <noscript>DOPPELGÄNGER needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
