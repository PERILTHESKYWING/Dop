<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DOPPELGÄNGER: a local-first Go training lab that studies one player's games with KataGo." />
    <meta name="theme-color" content="#e9e3d8" />
    <script>
      // Paint the saved background theme (lib/themes.ts, localStorage dop.theme) from the very first frame,
      // and give the browser bar the matching colour.
      (function () {
        var d = document.documentElement;
        var t = 'sunrise';
        try {
          var saved = localStorage.getItem('dop.theme');
          if (saved === 'sakura' || saved === 'mist' || saved === 'aurora') t = saved;
        } catch (e) {}
        d.dataset.theme = t;
        if (t === 'aurora') d.style.colorScheme = 'dark';
        var bar = { sunrise: '#e9e3d8', sakura: '#e3cfc7', mist: '#d3dae1', aurora: '#15181d' }[t];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bar);
      })();
    </script>
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DOPPELGÄNGER · Go training lab</title>
    <!-- The splash's rules are a renamed copy of the loader in src/styles/brand.css: node tools/brand/sync-splash.mjs -->
    <style id="splash-css">:root,[data-theme='sunrise']{--sp-bg:#e9e3d8;--sp-ink:#4e4034}[data-theme='sakura']{--sp-bg:#e3cfc7;--sp-ink:#523a4e}[data-theme='mist']{--sp-bg:#d3dae1;--sp-ink:#3b465a}[data-theme='aurora']{--sp-bg:#15181d;--sp-ink:#c2c4c8}#dop-splash{--sp-period:2.2s;display:grid;place-items:center;align-content:center;gap:18px;width:100%;height:100%;min-height:calc(var(--sp-size,112px) + 80px);color:var(--sp-ink);text-align:center;pointer-events:none}#dop-splash.is-overlay{position:fixed;inset:0;z-index:1000;height:auto;background:var(--sp-bg);pointer-events:auto}.sp-mark{width:var(--sp-size,112px);height:var(--sp-size,112px)}.sp-label{font:500 13px/1.3 var(--font,system-ui,sans-serif);opacity:0.8}.sp-d{stroke-dasharray:100 100;stroke-dashoffset:0}@media (prefers-reduced-motion:no-preference){.sp-d,.sp-echo{animation-duration:var(--sp-period);animation-iteration-count:infinite;animation-delay:var(--sp-delay,0s);animation-fill-mode:both}.sp-d{animation-name:sp-draw}.sp-echo{animation-name:sp-echo}}@keyframes sp-draw{0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(0.45,0,0.2,1)}40%,80%{stroke-dashoffset:0;animation-timing-function:cubic-bezier(0.6,0,0.6,1)}100%{stroke-dashoffset:-100}}@keyframes sp-echo{0%,30%{transform:translate(0,0);opacity:0;animation-timing-function:cubic-bezier(0.2,0.8,0.2,1)}50%,76%{transform:translate(9px,3px);opacity:0.55;animation-timing-function:cubic-bezier(0.6,0,0.8,0.4)}92%,100%{transform:translate(0,0);opacity:0}}</style>
  </head>
  <body>
    <div id="root">
      <!-- Shown from the first paint until React mounts; mirrors <BrandLoader overlay> (components/Brand.tsx). -->
      <div id="dop-splash" class="is-overlay" role="status">
        <svg class="sp-mark" viewBox="0 0 64 64" width="112" height="112" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#1f2a44" />
          <path class="sp-echo" d="M17 14h12a18 18 0 0 1 0 36H17z" fill="none" stroke="#f2b84b" stroke-width="5" stroke-linejoin="round" />
          <path class="sp-d" d="M17 14h12a18 18 0 0 1 0 36H17z" pathLength="100" fill="none" stroke="#f6efe2" stroke-width="5" stroke-linejoin="round" />
        </svg>
        <span class="sp-label">Opening your lab…</span>
      </div>
    </div>
    <script>
      // Run the splash on the clock BrandLoader uses (time since navigation), so the hand-over does not jump.
      document.documentElement.style.setProperty('--sp-delay', -Math.round(performance.now() % 2200) + 'ms');
    </script>
    <noscript>DOPPELGÄNGER needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
