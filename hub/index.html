:root[data-bg="dots"], [data-bg-demo="dots"] { --wall: radial-gradient(var(--tint) 1.2px, transparent 1.6px); --wall-size: 18px 18px; }
:root[data-bg="grid"], [data-bg-demo="grid"] { --wall: linear-gradient(var(--tint) 1px, transparent 1px), linear-gradient(90deg, var(--tint) 1px, transparent 1px); --wall-size: 26px 26px; }
:root[data-bg="board"], [data-bg-demo="board"] { --wall-bg: #d9ad66; --wall: linear-gradient(rgba(50, 30, 5, .3) 1px, transparent 1px), linear-gradient(90deg, rgba(50, 30, 5, .3) 1px, transparent 1px), var(--w-grain); --wall-size: 44px 44px, 44px 44px, 700px 700px; }
:root[data-bg="stones"], [data-bg-demo="stones"] { --wall: var(--w-stones); --wall-size: 420px 420px; }
:root[data-bg="dawn"], [data-bg-demo="dawn"] { --wall-bg: #bea6b6; --wall: var(--w-dawn); --wall-size: cover; }
:root[data-bg="sea"], [data-bg-demo="sea"] { --wall-bg: #7fa9b9; --wall: var(--w-sea); --wall-size: cover; }
:root[data-bg="forest"], [data-bg-demo="forest"] { --wall-bg: #9db49f; --wall: var(--w-forest); --wall-size: cover; }
:root[data-bg="night"], [data-bg-demo="night"] { --wall-bg: #121a3d; --wall: var(--w-night); --wall-size: cover; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-bg="board"], :root:not([data-theme="light"]) [data-bg-demo="board"] { --wall-bg: #4a3420; --wall: linear-gradient(rgba(240, 205, 150, .16) 1px, transparent 1px), linear-gradient(90deg, rgba(240, 205, 150, .16) 1px, transparent 1px), var(--w-grain-dark); --wall-size: 44px 44px, 44px 44px, 700px 700px; }
  :root:not([data-theme="light"])[data-bg="dawn"], :root:not([data-theme="light"]) [data-bg-demo="dawn"] { --wall-bg: #2a2236; --wall: var(--w-dusk); }
  :root:not([data-theme="light"])[data-bg="sea"], :root:not([data-theme="light"]) [data-bg-demo="sea"] { --wall-bg: #122435; --wall: var(--w-sea-dark); }

}

/* walls:end */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 16px; }
body { transition: background-color .2s, color .2s; }
#login, .app { background-color: var(--wall-bg); background-image: var(--wall); background-size: var(--wall-size); background-position: center; }
/* Panels over the background: frosted, so the wall carries under the sidebars and header. */
:root { --glass: color-mix(in srgb, var(--panel) 66%, transparent); }
:root:not([data-bg]), :root[data-bg=""] { --glass: var(--panel); }
.side, .team, .head, .tabs { background: var(--glass); -webkit-backdrop-filter: blur(2px) saturate(1.2); backdrop-filter: blur(2px) saturate(1.2); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 16px; transition: border-color .15s, box-shadow .15s; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-size: 15px; font-weight: 600; transition: background-color .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn:hover { background: var(--sel); }
.btn.primary { background: var(--green); color: var(--on-green); border-color: var(--green); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.btn.primary:hover { background: color-mix(in srgb, var(--green) 88%, var(--ink)); }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--sel); }
.err { color: var(--red); font-size: 15px; min-height: 1em; }

/* avatars: one flat colour per account */
.av { --c: var(--faint); width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.av.s { width: 18px; height: 18px; font-size: 10px; }
.av.l { width: 38px; height: 38px; font-size: 17px; }
.avs { display: inline-flex; }
.avs .av + .av { margin-left: -3px; box-shadow: 0 0 0 2px var(--panel); }
.av.hub { background: var(--ink); color: var(--bg); }

/* login */
#login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
#login form { background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 32px; width: min(380px, 100%); display: grid; gap: 14px; }
#login h1 { margin: 0; font-size: 26px; display: flex; align-items: center; gap: 10px; }

/* layout */
.app { --sw: 272px; --tw: 320px; display: grid; grid-template-columns: var(--sw) minmax(0, 1fr) var(--tw); height: 100vh; height: 100dvh; transition: grid-template-columns .22s ease; }
.col { min-height: 0; display: flex; flex-direction: column; }
.side { border-right: 1px solid var(--line); overflow: hidden; }
.team { border-left: 1px solid var(--line); overflow: hidden auto; }
/* Closable sidebars (desktop): the column folds to 0 and its content slides out at full width. */
.side > *, .team > * { min-width: calc(var(--sw) - 1px); }
.team > * { min-width: calc(var(--tw) - 1px); }
.side > .newrow { min-width: calc(var(--sw) - 25px); }
.app[data-side="off"] { --sw: 0px; }
.app[data-team="off"] { --tw: 0px; }
.app[data-side="off"] .side, .app[data-team="off"] .team { visibility: hidden; border-width: 0; transition: visibility 0s .22s; }
.pbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 8px; color: var(--soft); flex: none; }
.pbtn:hover { color: var(--ink); }
.pbtn svg { width: 19px; height: 19px; }
.brand .pbtn, .thead .pbtn { margin-right: -6px; }
.head .pbtn[aria-pressed="true"] { display: none; }
@media (prefers-reduced-motion: reduce) { .app { transition: none; } }

/* sidebar */
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
.brand b { font-size: 19px; white-space: nowrap; }
/* The logo (hub/logo.svg): a cream D with an amber echo on a navy tile. */
.logo { width: 28px; height: 28px; flex: none; display: inline-block; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f2a44'/><path d='M21 14h12a18 18 0 0 1 0 36H21z' fill='none' stroke='%23f2b84b' stroke-width='5' stroke-linejoin='round' transform='translate(5 3)' opacity='.55'/><path d='M17 14h12a18 18 0 0 1 0 36H17z' fill='none' stroke='%23f6efe2' stroke-width='5' stroke-linejoin='round'/></svg>") center / contain no-repeat; }
.logo.l { width: 40px; height: 40px; }
.logo.hero { width: 72px; height: 72px; }
/* Over a background the welcome text sits on frosted glass, so it stays readable on every scene. */
:root[data-bg]:not([data-bg=""]) .hello { background: var(--glass); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); border-radius: 18px; padding: 28px 32px; box-shadow: var(--shadow); }
:root[data-bg]:not([data-bg=""]) .note { align-self: center; max-width: 100%; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 10px; padding: 5px 12px; }
.live { margin-left: auto; white-space: nowrap; font-size: 14px; color: var(--green); font-weight: 600; }
.live.off { color: var(--red); }
.newrow { margin: 4px 12px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.newtask { text-align: left; display: flex; gap: 8px; align-items: center; padding-left: 11px; padding-right: 8px; white-space: nowrap; }
.newtask span { font-size: 19px; line-height: 1; }
.newtask svg { width: 16px; height: 16px; flex: none; }
.newtask[aria-pressed="true"] { background: var(--sel); border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.list { overflow-y: auto; padding: 4px 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.group { font-size: 13px; font-weight: 700; color: var(--faint); padding: 14px 10px 4px; text-transform: uppercase; letter-spacing: .05em; }
.trow { text-align: left; border: 0; background: none; border-radius: 6px; padding: 9px 10px; display: grid; gap: 4px; width: 100%; }
.trow:hover, .trow.on { background: var(--sel); }
.trow .ttl { font-weight: 600; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tsub { display: flex; gap: 7px; align-items: center; font-size: 14px; min-width: 0; }
.trow .tsub .when { margin-left: auto; color: var(--soft); white-space: nowrap; }
.stx { font-weight: 600; white-space: nowrap; }
.st-working .stx, .st-new .stx { color: var(--green); }
.st-waiting .stx { color: var(--amber); }
.st-queued .stx { color: var(--amber); }
.st-stalled .stx { color: var(--red); }
.st-done .stx { color: var(--soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.st-working .dot, .st-new .dot { background: var(--green); }
.st-waiting .dot, .st-queued .dot { background: var(--amber); }
.st-stalled .dot { background: var(--red); }

/* main */
.main { min-width: 0; }
.head { display: flex; align-items: center; gap: 10px; padding: 12px 24px; border-bottom: 1px solid var(--line); min-height: 60px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 19px; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: var(--chip); }
.head a { color: var(--green); font-size: 15px; font-weight: 600; }
.back { display: none; }
.feed { flex: 1; overflow-y: auto; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 16px; }
.feed > * { width: 100%; max-width: 820px; margin-left: auto; margin-right: auto; animation: rise .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .feed > * { animation: none; } }

/* Claude-style thinking: ✻ spinner, shimmering verb, elapsed time (frames, verbs and colours from Claude Code) */
.thinking { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--clay); min-width: 0; }
.spin { display: inline-flex; align-items: center; justify-content: center; width: 1.1em; height: 1.1em; color: var(--clay); flex: none; vertical-align: -0.15em; }
.star { display: inline-block; width: 1em; height: 1em; margin-right: 4px; color: var(--clay); vertical-align: -0.15em; }
.spin svg, .star svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.thinking .verb { font-weight: 600; background: linear-gradient(90deg, var(--clay) 0 40%, var(--clay-hi) 50%, var(--clay) 60% 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
.thinking .tmeta { color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.trow .spin { font-size: 14px; width: 9px; }
/* agents' thinking notes, folded like Claude's "Thought process" */
.thought { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; color: var(--soft); }
.thought summary { cursor: pointer; font-size: 14px; display: flex; gap: 8px; align-items: center; list-style: none; }
.thought summary::-webkit-details-marker { display: none; }
.thought summary::after { content: '›'; font-size: 16px; transition: transform .15s; }
.thought[open] summary::after { transform: rotate(90deg); }
.thought summary b { color: var(--ink); font-weight: 600; }
.thought .text { font-size: 15px; margin-top: 4px; }
.thoughts-hidden { font-size: 13px; }
/* Clawd, Claude Code's mascot, redrawn from its terminal sprite */
.clawd { width: 36px; height: 20px; flex: none; overflow: visible; }
.clawd.s { width: 22px; height: 12px; }
.clawd.l { width: 108px; height: 60px; }
.clawd .cl-body, .clawd .cl-legs { fill: var(--clay); }
.clawd .cl-eyes { fill: var(--clay-eye); }
.clawd g, .clawd rect { transform-box: fill-box; transform-origin: center bottom; }
.clawd .cl-eyes { transform-origin: center; animation: cl-blink 4.2s infinite; }
.clawd .cl-up { animation: cl-bob 1.8s steps(2, jump-none) infinite; }
.clawd.busy .cl-up { animation: none; }
.clawd.busy .lg.a { animation: cl-step .36s steps(2, jump-none) infinite; }
.clawd.busy .lg.b { animation: cl-step .36s steps(2, jump-none) infinite reverse; }
.clawd.busy .cl-arm { animation: cl-arm .36s steps(2, jump-none) infinite; }
.clawd.busy .cl-arm.r { animation-direction: reverse; }
.clawd.wave .cl-arm.r { animation: cl-wave .9s steps(2, jump-none) infinite; }
@keyframes cl-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
@keyframes cl-bob { from { transform: translateY(0); } to { transform: translateY(-.6px); } }
@keyframes cl-step { from { transform: translateY(0); } to { transform: translateY(-1px); } }
@keyframes cl-arm { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
@keyframes cl-wave { from { transform: translateY(0); } to { transform: translateY(-3px); } }
.stroll { display: block; animation: cl-stroll 9s ease-in-out infinite; }
@keyframes cl-stroll { 0%, 100% { transform: translateX(-40px); } 45%, 55% { transform: translateX(40px); } }
@media (prefers-reduced-motion: reduce) { .clawd *, .stroll, .thinking .verb { animation: none !important; } }
.row { display: flex; gap: 10px; align-items: flex-start; }
.row.me { justify-content: flex-end; }
.bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 11px 15px; min-width: 0; max-width: 100%; box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px -6px rgba(0, 0, 0, .12); }
.row.me .bubble { background: var(--me); border-color: transparent; border-radius: 14px 4px 14px 14px; max-width: 78%; box-shadow: none; }
.who { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
.who .when { font-weight: 400; color: var(--soft); }
.label { font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--chip); }
.label.q { background: var(--amber); color: #fff; }
.label.ok { background: var(--green); color: var(--on-green); }
.text { white-space: pre-wrap; word-wrap: break-word; line-height: 1.55; }
.pic { display: block; max-width: 100%; border-radius: 10px; margin-top: 8px; background: var(--line); min-height: 40px; }
.text a, .bubble a { color: var(--green); }
.picks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; justify-content: flex-end; }
.picks span { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--panel); }
/* swipe a message left (or use its ⋯ on a computer) to show Delete */
.sw { position: relative; overflow: hidden; flex: none; }
.sw-in { position: relative; z-index: 1; transition: transform .18s ease; touch-action: pan-y; }
.sw.drag .sw-in { transition: none; }
.sw.open .sw-in { transform: translateX(-104px); }
.sw-del { position: absolute; right: 0; top: 50%; transform: translateY(-50%); opacity: 0; pointer-events: none; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--red); color: var(--panel); font: inherit; font-size: 15px; font-weight: 700; transition: opacity .15s; }
.sw.open .sw-del, .sw.drag .sw-del { opacity: 1; pointer-events: auto; }
.sw-x { position: absolute; top: 2px; right: 2px; z-index: 2; opacity: 0; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: var(--panel); color: var(--soft); font: inherit; font-size: 15px; line-height: 1.3; }
.sw:hover .sw-x, .sw-x:focus-visible { opacity: 1; }
.sw.open .sw-x { opacity: 0; pointer-events: none; }
@media (hover: none) { .sw-x { display: none; } }
/* Copy on every prompt and reply */
.cp { border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; background: transparent; color: var(--soft); font: inherit; font-size: 12px; font-weight: 600; line-height: 1.6; cursor: pointer; }
.cp:hover, .cp:focus-visible { color: var(--ink); border-color: var(--soft); }
.cp.done { color: var(--green); border-color: var(--green); }
.row.me .cp { border-color: rgba(0, 0, 0, .12); }
.me-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
.note { text-align: center; font-size: 14px; color: var(--soft); display: flex; gap: 8px; justify-content: center; align-items: center; }
.note.alert { color: var(--amber); font-weight: 600; }
.task { border: 1px solid var(--line); border-left: 4px solid var(--ink); background: var(--panel); border-radius: 10px; padding: 14px 18px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 4px 12px -6px rgba(0, 0, 0, .12); }
.task .who { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); }
.handover { border: 1px solid var(--line); border-left: 4px solid var(--green); background: var(--panel); border-radius: 10px; padding: 14px 18px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 4px 12px -6px rgba(0, 0, 0, .12); }
.handover dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.handover dt { font-weight: 700; }
.handover dd { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
.cards { display: grid; gap: 8px; margin-top: 10px; }
.tcard { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 13px; width: 100%; transition: background-color .15s, border-color .15s, transform .12s; }
.tcard:hover { background: var(--sel); border-color: var(--faint); transform: translateY(-1px); }
.tcard .ttl { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcard .meta { grid-column: 2; display: flex; gap: 8px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.tcard .go { grid-row: 1 / span 2; grid-column: 3; font-size: 14px; font-weight: 700; color: var(--green); }

/* empty project chat */
.hello { margin: auto; text-align: center; max-width: 560px; padding: 24px 8px; display: grid; gap: 14px; justify-items: center; }
.hello h3 { margin: 0; font-size: 28px; line-height: 1.2; }
.hello p { margin: 0; font-size: 17px; line-height: 1.5; color: var(--soft); }
.starters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* composer */
.compose { padding: 0 24px calc(16px + env(safe-area-inset-bottom)); }
.cbox { max-width: 820px; margin: 0 auto; border: 1px solid var(--line); background: var(--panel); border-radius: 18px; padding: 12px 12px 10px 16px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.cbox:focus-within { border-color: color-mix(in srgb, var(--green) 55%, var(--line)); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--green) 16%, transparent); }
.cbox textarea { width: 100%; border: 0; background: none; resize: none; padding: 4px 0; min-height: 28px; max-height: 40vh; outline: none; line-height: 1.45; }
.cbox textarea:focus-visible { box-shadow: none; }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 5px 10px; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.chip:hover { background: var(--sel); border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .caret { font-size: 11px; opacity: .7; }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.meter i { width: 3px; border-radius: 1px; background: currentColor; opacity: .25; }
.meter i:nth-child(1) { height: 4px; } .meter i:nth-child(2) { height: 6px; } .meter i:nth-child(3) { height: 8px; } .meter i:nth-child(4) { height: 10px; } .meter i:nth-child(5) { height: 12px; }
.meter i.on { opacity: 1; }
.send { margin-left: auto; width: 38px; height: 38px; border-radius: 10px; transition: transform .1s, filter .15s; border: 0; background: var(--green); color: var(--on-green); font-size: 19px; font-weight: 700; display: grid; place-items: center; }
.send:hover:not(:disabled) { filter: brightness(1.08); }
.send:active:not(:disabled) { transform: scale(.94); }
.send:disabled { opacity: .45; cursor: default; }

/* popover menus */
.pop { position: fixed; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; width: 300px; max-width: calc(100vw - 24px); max-height: 60vh; overflow-y: auto; }
.pop h4 { margin: 6px 10px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); }
.opt { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 9px 10px; transition: background-color .12s; }
.opt:hover { background: var(--sel); }
.opt.on { background: color-mix(in srgb, var(--green) 9%, transparent); }
.opt b { font-size: 15px; }
.opt small { grid-column: 2; font-size: 14px; color: var(--soft); }
.opt .tick { grid-row: 1 / span 2; grid-column: 3; font-weight: 700; color: var(--green); visibility: hidden; }
.opt.on .tick { visibility: visible; }
.opt .box { grid-row: 1 / span 2; grid-column: 3; width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 12px; color: transparent; }
.opt.on .box { background: var(--green); border-color: var(--green); color: var(--on-green); }
.opt > .av, .opt > .meter { grid-row: 1 / span 2; }
.pop .foot { display: flex; justify-content: flex-end; padding: 6px 4px 2px; }

/* team panel */
.thead { display: flex; align-items: center; gap: 6px; padding: 16px 16px 8px; }
.thead h3 { margin: 0; font-size: 19px; flex: 1; }
.cap { padding: 0 16px 10px; margin: 0; font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px 12px; }
.stats div { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; gap: 0; background: var(--bg); }
.stats b { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats b.ready { color: var(--green); } .stats b.low { color: var(--red); }
.stats span { font-size: 14px; font-weight: 600; }
.acards { display: grid; gap: 10px; padding: 0 12px; }
.acard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); display: grid; gap: 9px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); transition: border-color .15s, box-shadow .15s; }
.acard:hover { box-shadow: 0 4px 14px -6px rgba(0, 0, 0, .18); }
.acard.low { border-color: var(--red); }
.atop { display: flex; gap: 10px; align-items: center; min-width: 0; }
.aname { display: grid; gap: 1px; min-width: 0; flex: 1; }
.nmrow { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.conn { font-size: 14px; font-weight: 600; color: var(--green); }
.conn.no { color: var(--amber); }
.bubble.pending { opacity: .7; }
.sending { font-size: 13px; font-weight: 600; margin-top: 6px; text-align: right; }
.opt.danger b { color: var(--red); }
.group.arch { border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.group.arch:hover { color: var(--ink); }
.btn.more { font-size: 18px; line-height: 1; padding: 3px 10px 7px; }
.aname .nm { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--chip); }
.atop .state { font-size: 14px; font-weight: 700; white-space: nowrap; }
.state.ready, .state.busy { color: var(--green); } .state.low { color: var(--red); } .state.chat { color: var(--soft); }
.acard .sub { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -2px; }
.use { display: grid; grid-template-columns: 58px 1fr 42px; gap: 2px 8px; align-items: center; font-size: 14px; }
.use .lbl { font-weight: 600; }
.use .pct { text-align: right; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.use .rs { grid-column: 2 / span 2; color: var(--soft); font-size: 13px; margin-top: -2px; }
.track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--green); border-radius: 4px; transition: width .4s ease; }
.fill.warn { background: var(--amber); } .fill.bad { background: var(--red); }
.nouse { font-size: 14px; color: var(--soft); line-height: 1.4; }
.afoot { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.afoot .mdl { font-size: 13px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: var(--chip); }
.afoot .upd { font-size: 13px; color: var(--soft); margin-left: auto; }
.aacts { display: flex; gap: 4px; flex-wrap: wrap; }
.agents { padding: 14px 12px 0; display: grid; gap: 6px; }
.agents .thead { padding: 4px 4px 0; } .agents .cap { padding: 0; font-size: 14px; color: var(--soft); }
.ag-who { font-weight: 700; font-size: 13px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; padding: 6px 4px 0; }
.ag { display: grid; gap: 4px; padding: 7px 8px; border-radius: 8px; background: var(--sel); min-width: 0; }
.ag-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ag-top .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ag-top small { color: var(--soft); flex: none; }
.ag .dot { background: var(--green); } .ag.done .dot { background: var(--faint); } .ag.failed .dot { background: var(--red); } .ag.stale .dot { background: var(--amber); }
.ag-step { color: var(--soft); font-size: 14px; overflow-wrap: anywhere; }
.ag .track { height: 5px; border-radius: 3px; background: var(--line, rgba(128,128,128,.25)); overflow: hidden; }
.ag .track .fill { height: 100%; background: var(--green); transition: width .4s; } .ag.failed .fill { background: var(--red); }
.tasks { padding: 14px 12px 0; display: grid; gap: 6px; }
.tasks > *, .tgroup { min-width: 0; }
.tasks .cap { white-space: nowrap; }
.tasks .thead { padding: 4px 4px 0; }
.tasks .cap { padding: 0; font-size: 14px; color: var(--soft); }
.tgroup summary { display: flex; justify-content: space-between; cursor: pointer; padding: 6px 4px; font-weight: 700; font-size: 13px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.tgroup summary b { font-weight: 600; }
.tk { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px; background: none; border: 0; }
.tk:hover { background: var(--sel); }
.tk .tk-dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--faint); }
.tk .spin { width: 14px; }
.tk.st-waiting .tk-dot { border-color: var(--amber); background: var(--amber); }
.tk.st-done .tk-dot { border-color: var(--green); background: var(--green); }
.tk.st-done .ttl { text-decoration: line-through; color: var(--soft); }
.tk .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
.tk .tw { display: flex; align-items: center; gap: 6px; flex: none; }
.tk small { color: var(--soft); font-size: 12px; }
.tfoot { padding: 16px 16px 24px; display: grid; gap: 10px; }

/* sheets */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; z-index: 7; }
.sheet .sbox { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 20px 60px -12px rgba(0, 0, 0, .35); border-radius: 18px; padding: 26px; animation: rise .18s ease-out; width: min(560px, 100%); max-height: 90dvh; overflow-y: auto; display: grid; gap: 12px; }
.sheet h3 { margin: 0; font-size: 20px; }
.sheet p { margin: 0; line-height: 1.5; color: var(--soft); }
.sheet code, .copyline { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
.copyline { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: block; white-space: pre-wrap; }
.routine { display: grid; grid-template-columns: 110px 1fr; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.routine input { min-width: 0; }
.field { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; border-radius: 9px; background: var(--chip); border: 1px solid var(--line); justify-self: start; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 6px 14px; font-weight: 600; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.walls { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.walls button { display: grid; gap: 6px; border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--soft); text-align: center; }
.walls i { display: block; height: 58px; border-radius: 10px; border: 2px solid var(--line); background-color: var(--wall-bg); background-image: var(--wall); background-size: var(--wall-size); background-position: center; }
.walls button[aria-pressed="true"] { color: var(--ink); }
.walls button[aria-pressed="true"] i { border-color: var(--green); box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 30%, transparent); }
.sect { font-size: 13px; font-weight: 700; color: var(--faint); margin-top: 6px; text-transform: uppercase; letter-spacing: .05em; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tabs { display: none; }

@media (max-width: 1100px) { .app { --sw: 240px; --tw: 290px; } }
@media (max-width: 860px) {

  .tabs .badge { background: var(--amber); color: #fff; border-radius: 9px; font-size: 12px; padding: 0 6px; }
}
</style>

<body>
<div id="login">
  <form id="loginForm">
    <h1><i class="logo l" role="img" aria-label="Dop hub logo"></i>Dop hub</h1>
    <input id="pw" type="password" placeholder="Hub password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Open</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div class="app hidden" id="app" data-tab="chat">
  <aside class="col side">
    <div class="brand"><i class="logo" role="img" aria-label="Dop hub logo"></i><b>Dop hub</b><span id="clawdMark" title="Clawd"></span><span class="live" id="live">Live</span><button type="button" class="btn quiet pbtn" data-panel="side" aria-label="Close threads" title="Close threads ( [ )"></button></div>
    <div class="newrow">
      <button class="btn newtask" id="newTask" type="button" title="Project chat: the coordinator splits it into threads"><span>+</span>New task</button>
      <button class="btn newtask" id="newChat" type="button" aria-pressed="false" title="A clean chat with one agent, no coordinator"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 16.5v-3l9.8-9.8a2.1 2.1 0 0 1 3 3l-9.8 9.8z"/><path d="M11.5 5.5l3 3"/></svg>New chat</button>
    </div>
    <nav class="list" id="threads"></nav>
  </aside>
  <main class="col main">
    <header class="head" id="head"></header>
    <div class="feed" id="feed"></div>
    <form class="compose" id="compose">
      <div class="cbox">
        <textarea id="text" rows="1" placeholder="What should the team do?"></textarea>
        <div class="tools" id="tools"></div>
      </div>
    </form>
  </main>
  <aside class="col team" id="team"></aside>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="threads">Threads <span class="badge hidden" id="needBadge"></span></button>
    <button type="button" data-tab="chat">Chat</button>
    <button type="button" data-tab="team">Team</button>
  </nav>
</div>
<div id="pop" class="pop hidden"></div>
<div id="sheet" class="sheet hidden"><div class="sbox" id="sheetBox"></div></div>

<script>
const MODELS = ['opus', 'sonnet', 'haiku', 'fable'];
const MODEL_NAME = { opus: 'Opus', sonnet: 'Sonnet', haiku: 'Haiku', fable: 'Fable' };
const MODEL_HINT = { '': 'The coordinator picks per thread', opus: 'Hardest work and design', sonnet: 'Everyday coding', haiku: 'Quick, small jobs', fable: 'If your account has it' };
// Claude's own effort levels.
const THINK = ['low', 'medium', 'high', 'xhigh', 'max'];
const THINK_NAME = { low: 'Low', medium: 'Medium', high: 'High', xhigh: 'xHigh', max: 'Max' };
const THINK_HINT = { low: 'Fastest, least reasoning', medium: 'Balanced', high: 'Thinks hard and checks its work', xhigh: 'Thinks harder on every step', max: 'Deepest (ultrathink)' };
const STATUS = { new: 'Starting', working: 'Working', waiting: 'Needs you', queued: 'Waiting', stalled: 'Stopped', done: 'Done' };
const PALETTE = ['#2f6b4f', '#b4532a', '#9a7412', '#7a4f86', '#2e6f73', '#9b3d4a', '#5f6b2a', '#4f5b66'];
let proj = { project: 'Dop', owner: 'XIAO' };
const routinePrompt = () => `You are an agent in ${proj.owner}'s ${proj.project} hub. First call hub_start from the ${proj.project} hub connector, with payload set to the full text of the routine-fire payload (or no payload if there is none). Then do exactly what hub_start returns.`;
const STARTERS = [['Fix a bug', 'Fix this bug: '], ['Review a PR', 'Review the latest PR and list anything that needs fixing.'], ['Research', 'Research this and give me a short answer with sources: '], ['Write docs', 'Write or update the docs for: ']];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const clock = (t) => { const d = new Date(t); const today = new Date().toDateString() === d.toDateString(); return d.toLocaleString([], today ? { hour: '2-digit', minute: '2-digit' } : { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const ago = (ms) => ms < 60e3 ? 'just now' : ms < 3600e3 ? `${Math.round(ms / 60e3)} min` : ms < 86400e3 ? `${Math.round(ms / 3600e3)} h` : `${Math.round(ms / 86400e3)} d`;
const until = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const ms = d - Date.now(); if (ms <= 0) return 'resets now'; const sameDay = d.toDateString() === new Date().toDateString(); return 'resets ' + (sameDay ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' })); };
const ls = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
let pw = ls.get('hubpw') || '';
let S = { threads: [], accounts: [], messages: [], agents: [], settings: {}, overhead: {}, loading: true };
// Last view, so a reload paints at once and then catches up.
try { const c = JSON.parse(ls.get('hub-cache') || 'null'); if (c && pw) S = { ...c, loading: false }; } catch {}
// sel: 0 is Project chat, a thread id, or NEW_CHAT for a clean chat that has no thread yet.
const NEW_CHAT = -1;
let seq = '', sel = 0, drafts = {}, colors = {}, initials = {}, showArchived = false, tmp = 0, speed = { rtt: 0, ms: 0 };
let opts = { model: '', thinking: 'medium', accounts: [], team: 1, direct: false };
try { opts = { ...opts, ...JSON.parse(localStorage.getItem('hub-opts') || '{}') }; } catch {}
const saveOpts = () => { try { localStorage.setItem('hub-opts', JSON.stringify(opts)); } catch {} };

async function api(op, body) {
  const res = await fetch(`/api/hub?op=${op}`, { method: body ? 'POST' : 'GET', headers: { 'x-hub-password': pw, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await res.json().catch(() => ({}));
  // Only a wrong password asks again; anything else just retries.
  if (res.status === 401) { ls.del('hubpw'); showLogin(pw ? 'The hub password changed. Type the new one.' : ''); throw new Error('auth'); }
  if (!res.ok) throw new Error(j.error || `Error ${res.status}`);
  return j;
}
function showLogin(msg = '') { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); $('loginErr').textContent = msg; }
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); pw = $('pw').value;
  try { await load(true); ls.set('hubpw', pw); showApp(); readUsage(); }
  catch (err) { if (err.message !== 'auth') $('loginErr').textContent = err.message; }
});
// The project this hub serves (HUB_PROJECT on the server, "Dop" by default) names the page.
function setProject(name, owner) {
  proj = { project: name, owner: owner || proj.owner };
  const t = `${name} hub`; if (document.title === t) return;
  document.title = t;
  for (const b of document.querySelectorAll('.brand b, #login h1')) b.lastChild.textContent = t;
}
const maxId = () => S.messages.reduce((x, m) => (typeof m.id === 'number' && m.id > x ? m.id : x), 0);
// full: the whole recent window; otherwise only messages newer than the last one held.
async function load(full) {
  const t0 = performance.now();
  const since = full ? 0 : maxId();
  const d = await api('state' + (since ? `&since=${since}` : ''));
  speed = { rtt: Math.round(performance.now() - t0), ms: d.ms || 0 };
  const gone = new Set(d.deleted || []);
  const held = d.full ? [] : S.messages.filter((m) => !m.pending && !gone.has(m.id));
  const have = new Set(held.map((m) => m.id));
  const ids = new Set(d.threads.map((t) => t.id));
  // A message still sending stays until the hub has it.
  const sending = S.messages.filter((m) => m.pending && !d.messages.some((x) => x.from === 'XIAO' && x.text === m.text));
  S = { ...S, threads: d.threads, accounts: d.accounts, agents: d.agents || [], settings: d.settings, overhead: d.overhead, loading: false,
    messages: [...held, ...d.messages.filter((m) => !have.has(m.id)), ...sending].filter((m) => m.pending || !m.thread || ids.has(m.thread)) };
  if (d.project) setProject(d.project, d.owner);
  seq = d.seq; render();
  ls.set('hub-cache', JSON.stringify({ ...S, messages: S.messages.filter((m) => !m.pending).slice(-300) }));
}
async function poll() { const s = await api('seq'); if (s.seq !== seq) await load(false); }
function setLive(ok) { $('live').textContent = ok ? 'Live' : 'Offline'; $('live').classList.toggle('off', !ok); }
async function tick() {
  if (document.hidden || !pw || $('app').classList.contains('hidden')) return;
  try { await poll(); setLive(true); } catch (e) { if (e.message !== 'auth') setLive(false); }
}
// Usage is read from Claude in the background, so nothing waits on it.
async function readUsage(force) { try { await api('usage' + (force ? '&force=1' : '')); await load(false); } catch {} }
setInterval(tick, 3000);
setInterval(() => { if (!document.hidden && (S.agents || []).some((g) => g.status === 'running')) renderTeam(); }, 15_000);
setInterval(() => { if (!document.hidden && pw) readUsage(); }, 5 * 60_000);
document.addEventListener('visibilitychange', tick);

// ---------- accounts and avatars ----------
function assignColors() {
  const names = S.accounts.map((a) => a.name).sort();
  const used = new Set(); colors = {};
  for (const n of names) {
    let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    let i = h % PALETTE.length; for (let k = 0; k < PALETTE.length && used.has(i); k++) i = (i + 1) % PALETTE.length;
    used.add(i); colors[n] = PALETTE[i];
  }
  initials = {};
  for (const n of names) { const f = n[0].toUpperCase(); initials[n] = names.filter((x) => x[0].toUpperCase() === f).length > 1 ? f + (n[1] || '').toLowerCase() : f; }
}
const acctOf = (from) => S.accounts.find((a) => from === a.name || String(from).startsWith(a.name + ' '));
const av = (name, size = '') => name ? `<span class="av ${size}" style="--c:${colors[name] || 'var(--faint)'}" title="${esc(name)}">${esc(initials[name] || name.slice(0, 1).toUpperCase())}</span>` : '';
const avList = (names, size = 's') => names.length ? `<span class="avs">${names.slice(0, 4).map((n) => av(n, size)).join('')}</span>` : '';
const meter = (lvl) => `<span class="meter">${THINK.map((t, i) => `<i class="${i <= THINK.indexOf(lvl) ? 'on' : ''}"></i>`).join('')}</span>`;
const pctMax = (a) => Math.max(a.usage?.five_hour_pct ?? 0, a.usage?.seven_day_pct ?? 0);
function acctState(a) {
  if (a.low) return ['low', 'Running low'];
  if (a.working) return ['busy', 'Working'];
  if (!a.models.length) return ['chat', a.plan === 'free' ? 'Chat helper' : 'No routines'];
  return ['ready', 'Ready'];
}
const workingOn = (a) => S.threads.filter((t) => (t.account === a.name || crewOf(t).includes(a.name)) && t.status === 'working').map((t) => t.title);
// The account doing the work, or the accounts XIAO allowed when none is on it yet.
function threadAccounts(t) { return t.account ? [t.account, ...crewOf(t)] : t.accounts || []; }
// Team members working with the lead right now.
function crewOf(t) { return Object.keys(t.crew || {}).filter((n) => n !== t.account && t.crew[n].role === 'member' && !t.crew[n].done && !t.crew[n].gone); }
const TEAM_MAX = 4;
const teamName = (n) => (n > 1 ? `Team of ${n}` : 'Solo');
// Usage at or above this share counts as low (Settings › minimum usage left).
const lowAt = () => 100 - (S.settings?.minLeftPct ?? 15);


// ---------- thinking and Clawd ----------
// Spinner frames, verbs and colours are Claude Code's own (read from its CLI).
// Drawn as SVG, not text: phones turn ✳ and friends into emoji and grey them.
// Frames copy · ✢ ✳ ✶ ✻ ✽ as [petals, length, width, centre dot].
const petals = (n, len, w, dot) => `<svg viewBox="0 0 24 24" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<ellipse cx="12" cy="${12 - len / 2}" rx="${w}" ry="${len / 2}" transform="rotate(${(i * 360) / n} 12 12)"/>`).join('')}${dot ? `<circle cx="12" cy="12" r="${dot}"/>` : ''}</svg>`;
const SPIN = [petals(0, 0, 0, 2.2), petals(4, 9, 2.2, 1.6), petals(8, 10, 1, 1.4), petals(6, 10, 2.4, 2), petals(8, 10, 1.9, 0), petals(8, 11, 2.6, 1.8)];
const SPIN_LOOP = [...SPIN, ...SPIN.slice().reverse()];
let spinI = 0;
const spin = () => `<span class="spin">${SPIN_LOOP[spinI]}</span>`;
const VERBS = ['Accomplishing', 'Architecting', 'Baking', 'Beboppin\'', 'Brewing', 'Calculating', 'Canoodling', 'Cerebrating', 'Churning', 'Clauding', 'Cogitating', 'Combobulating', 'Concocting', 'Contemplating', 'Cooking', 'Crafting', 'Crunching', 'Deciphering', 'Deliberating', 'Doodling', 'Elucidating', 'Envisioning', 'Fermenting', 'Finagling', 'Forging', 'Frolicking', 'Generating', 'Germinating', 'Hatching', 'Herding', 'Honking', 'Ideating', 'Imagining', 'Incubating', 'Inferring', 'Kneading', 'Manifesting', 'Marinating', 'Meandering', 'Moseying', 'Mulling', 'Noodling', 'Orchestrating', 'Percolating', 'Philosophizing', 'Pondering', 'Pontificating', 'Puttering', 'Puzzling', 'Reticulating', 'Ruminating', 'Scampering', 'Schlepping', 'Simmering', 'Spelunking', 'Stewing', 'Synthesizing', 'Thinking', 'Tinkering', 'Transmogrifying', 'Unfurling', 'Vibing', 'Whirring', 'Wibbling', 'Working', 'Wrangling', 'Zigzagging'];
// Each line starts on its own verb and moves to a new one every few seconds.
const VERB_MS = 3000;
const verbSeed = (key) => { let h = 0; for (const ch of String(key)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % VERBS.length; };
const verbAt = (seed) => VERBS[(seed + Math.floor(Date.now() / VERB_MS) * 17) % VERBS.length];
const span = (ms) => { const sec = Math.max(0, Math.floor(ms / 1000)); return sec < 60 ? `${sec}s` : sec < 3600 ? `${Math.floor(sec / 60)}m ${sec % 60}s` : `${Math.floor(sec / 3600)}h ${Math.floor(sec / 60) % 60}m`; };
// Clawd: 18 x 5 pixels, each pixel 1 wide and 2 tall like the terminal's quarter blocks.
function clawd(cls = '') {
  return `<svg class="clawd ${cls}" viewBox="0 0 18 10" aria-hidden="true" shape-rendering="crispEdges"><g class="cl-up"><g class="cl-body"><rect x="3" y="0" width="12" height="8"/><rect class="cl-arm l" x="1" y="4" width="2" height="2"/><rect class="cl-arm r" x="15" y="4" width="2" height="2"/></g><g class="cl-eyes"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g></g><g class="cl-legs"><rect class="lg a" x="4" y="8" width="1" height="2"/><rect class="lg b" x="6" y="8" width="1" height="2"/><rect class="lg a" x="11" y="8" width="1" height="2"/><rect class="lg b" x="13" y="8" width="1" height="2"/></g></svg>`;
}
// One live line per agent at work: the text stays fixed so the feed only
// redraws on news; the spinner and clock tick in place.
function thinkingLine(who, since, key) {
  return `<div class="thinking">${clawd('s busy')}${spin()}<span class="verb" data-verb="${verbSeed(key)}">${esc(verbAt(verbSeed(key)))}…</span><span class="tmeta">(<span data-since="${since}"></span> · ${esc(who)})</span></div>`;
}
// Who is working in this view right now.
function liveLines(t, msgs) {
  if (!t) {
    // Project chat: the coordinator is on XIAO's last prompt until it answers.
    const last = msgs.filter((m) => m.from === 'XIAO' && !m.pending).at(-1);
    if (!last || Date.now() - last.at > 20 * 60e3 || msgs.some((m) => m.id > last.id && m.kind === 'routed')) return '';
    return thinkingLine('Coordinator', last.at, 'c' + last.id);
  }
  if (t.archived || !['working', 'new'].includes(t.status)) return '';
  const out = [];
  if (t.account && thoughtShown(t.account)) out.push(thinkingLine(t.status === 'new' ? `${t.account}, starting` : t.account, t.startedAt || t.lastAgentAt || t.updatedAt || Date.now(), `${t.id}${t.account}${t.startedAt || ''}`));
  for (const n of crewOf(t)) if (thoughtShown(n)) out.push(thinkingLine(n, t.crew[n].startedAt || t.crew[n].at || Date.now(), `${t.id}${n}${t.crew[n].startedAt || ''}`));
  return out.join('');
}
let verbStep = Math.floor(Date.now() / VERB_MS);
setInterval(() => {
  if (document.hidden) return;
  spinI = (spinI + 1) % SPIN_LOOP.length;
  for (const el of document.querySelectorAll('.spin')) el.innerHTML = SPIN_LOOP[spinI];
  if (Math.floor(Date.now() / VERB_MS) !== verbStep) {
    verbStep = Math.floor(Date.now() / VERB_MS);
    for (const el of document.querySelectorAll('[data-verb]')) el.textContent = verbAt(Number(el.dataset.verb)) + '…';
  }
  for (const el of document.querySelectorAll('[data-since]')) el.textContent = span(Date.now() - Number(el.dataset.since));
}, 120);
// Agents' thinking notes: hidden, folded (default) or open, and per account.
let think = { mode: 'fold', hide: [] };
try { think = { ...think, ...JSON.parse(ls.get('hub-think') || '{}') }; } catch {}
const saveThink = () => ls.set('hub-think', JSON.stringify(think));
const thoughtShown = (name) => !think.hide.includes(name);
const openThoughts = new Set();
function thoughtHtml(m) {
  const a = acctOf(m.from);
  if (think.mode === 'hide' || !thoughtShown(a?.name || m.from)) return '';
  const open = think.mode === 'open' || openThoughts.has(m.id);
  return `<details class="thought" data-tid="${m.id}"${open ? ' open' : ''}><summary>${av(a?.name, 's')}<b>${esc(m.from)}</b> thought <span class="when">${clock(m.at)}</span></summary><div class="text">${linkify(m.text)}</div></details>`;
}
$('feed').addEventListener('toggle', (e) => {
  const d = e.target; if (!d.matches?.('details.thought')) return;
  const id = Number(d.dataset.tid);
  if (d.open) openThoughts.add(id); else openThoughts.delete(id);
}, true);

// ---------- sidebar ----------
function threadRow(t) {
  const last = S.messages.filter((m) => m.thread === t.id).at(-1);
  const st = t.archived ? 'Archived' : t.status === 'queued' && t.account ? `Waiting for ${t.account}` : STATUS[t.status] || t.status;
  return `<button class="trow st-${t.status} ${sel === t.id ? 'on' : ''}" data-thread="${t.id}">
    <span class="ttl">${esc(t.title)}</span>
    <span class="tsub">${avList(threadAccounts(t))}${t.status === 'working' && !t.archived ? spin() : ''}<span class="stx">${esc(st)}</span><span class="when">${last ? ago(Date.now() - last.at).replace('just now', 'now') : ''}</span></span>
  </button>`;
}
function renderSide() {
  $('clawdMark').innerHTML = clawd(S.threads.some((t) => t.status === 'working' && !t.archived) ? 'busy' : '');
  $('newChat').setAttribute('aria-pressed', sel === NEW_CHAT);
  const live = S.threads.filter((t) => !t.archived);
  const archived = S.threads.filter((t) => t.archived).reverse();
  const by = (f) => live.filter(f).reverse();
  const groups = [
    ['Needs you', by((t) => t.status === 'waiting')],
    ['Working', by((t) => ['working', 'new'].includes(t.status))],
    ['Waiting', by((t) => ['queued', 'stalled'].includes(t.status))],
    ['Done', by((t) => t.status === 'done').slice(0, 30)],
  ];
  const last = S.messages.filter((m) => m.thread === 0 && m.from === 'XIAO').at(-1);
  $('threads').innerHTML = `<button class="trow ${sel === 0 ? 'on' : ''}" data-thread="0"><span class="ttl">Project chat</span><span class="tsub"><span class="stx" style="color:var(--soft);font-weight:400;overflow:hidden;text-overflow:ellipsis">${last ? esc('You: ' + last.text.split('\n')[0].slice(0, 60)) : 'Start here'}</span></span></button>`
    + groups.filter((g) => g[1].length).map((g) => `<div class="group">${g[0]} · ${g[1].length}</div>${g[1].map(threadRow).join('')}`).join('')
    + (archived.length ? `<button type="button" class="group arch" data-archived>${showArchived ? '▾' : '▸'} Archived · ${archived.length}</button>${showArchived ? archived.map(threadRow).join('') : ''}` : '');
  const need = live.filter((t) => t.status === 'waiting').length;
  $('needBadge').textContent = need; $('needBadge').classList.toggle('hidden', !need);
}

// ---------- feed ----------
function threadCard(t) {
  return `<button class="tcard st-${t.status}" data-thread="${t.id}"><span class="dot"></span><span class="ttl">${esc(t.title)}</span><span class="go">Open</span>
    <span class="meta">${avList(threadAccounts(t))}<span class="stx">${esc(t.archived ? 'Archived' : STATUS[t.status])}</span><span>${MODEL_NAME[t.model] || t.model}</span><span>${meter(t.thinking || 'medium')}</span></span></button>`;
}
function picksOf(meta) {
  if (!meta) return '';

// Swipe left on a message (touch or pen) to show its Delete button; swipe right or tap elsewhere to hide it.
let drag = null, swiped = 0;
$('feed').addEventListener('pointerdown', (e) => {
  const sw = e.target.closest('.sw');
  if (e.pointerType === 'mouse' || !sw || e.target.closest('.sw-del')) return;
  drag = { sw, id: Number(sw.dataset.mid), x: e.clientX, y: e.clientY, base: sw.classList.contains('open') ? -104 : 0, at: null };
});
$('feed').addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.at == null) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (Math.abs(dx) < 10) return;
    drag.sw.classList.add('drag');
  }
  drag.at = Math.max(-150, Math.min(0, drag.base + dx));
  drag.sw.querySelector('.sw-in').style.transform = `translateX(${drag.at}px)`;
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.at == null) return;
  swiped = Date.now();
  d.sw.classList.remove('drag'); d.sw.querySelector('.sw-in').style.transform = '';
  setOpen(d.at < -50 ? d.id : openMsg === d.id ? null : openMsg);
}

  const body = sel > 0 ? { text, thread: sel } : sel === NEW_CHAT ? { text, chat: true, ...picks } : { text, thread: 0, direct: opts.direct, ...picks };
  // Show it straight away; starting the agents happens while it says Sending.
  S.messages.push({ id: `tmp${++tmp}`, at: Date.now(), thread: sel, from: 'XIAO', kind: 'prompt', text, meta: sel > 0 ? null : body, pending: true });
  renderFeed(); toBottom();
  let made = null;

  S.messages = S.messages.filter((m) => !m.pending);

  if (from === NEW_CHAT && made?.thread) { await load(false).catch(() => {}); if (sel === NEW_CHAT) openThread(made.thread); return; }

});

  if (t.closest('[data-newkey]')) {
    const n = t.dataset.newkey;
    if (!confirm(`Make a new link for ${n}? Connectors made with the old link stop working, and so do routines that use them, until you add the new link on claude.ai.`)) return;
    await api('account-newkey', { name: n });
    await openSheet('connect', n);
    const out = $('testOut'); out.classList.remove('hidden'); out.style.color = 'var(--green)'; out.style.fontWeight = '600';
    out.textContent = 'New link made. The old one no longer works.';
    return;
  }
  if (t.closest('[data-addrow]')) return $('fRoutines').insertAdjacentHTML('beforeend', routineRow({ model: 'sonnet', id: '' }));
  if (t.closest('[data-remove]')) { if (confirm('Remove this account from the hub?')) { await api('account-remove', { name: t.dataset.remove }); closeSheet(); load(true); } return; }
  if (t.closest('[data-save]')) {
    const routines = [...document.querySelectorAll('.routine')].map((r) => ({ model: r.querySelector('.rModel').value, id: r.querySelector('.rId').value.trim(), token: r.querySelector('.rToken').value.trim() })).filter((r) => r.id);
    try { await api('account', { name: $('fName').value.trim(), plan: $('fPlan').value, routines, key: $('fKey').value.trim() || undefined }); closeSheet(); load(false).then(() => readUsage(true)); } catch (err) { $('fErr').textContent = err.message; }
    return;
  }
  if (t.closest('[data-saveusage]')) { await api('account-usage', { name: t.dataset.saveusage, five_hour_pct: $('u5').value, seven_day_pct: $('u7').value }); closeSheet(); return load(true); }
  if (t.closest('[data-savesettings]')) {
    await api('settings', { coordinatorModel: $('sModel').value, coordinatorAccount: $('sAcct').value, overheadTokens: Number($('sBudget').value), minLeftPct: Number($('sMinLeft').value), autoResume: $('sResume').checked });
    closeSheet(); load(true);
  }
});

setTab('chat');
$('loginForm').querySelector('h1').insertAdjacentHTML('beforeend', clawd('wave'));
// With a saved password the page opens straight away (from the last view)
// and catches up; only a wrong password brings the sign-in box back.
if (pw) {
  showApp(); render(); toBottom();
  load(!S.messages.length).then(() => setLive(true), (e) => e.message !== 'auth' && setLive(false));
  readUsage();
}
else showLogin();
</script>
</body>
</html>
