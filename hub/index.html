<script>
const MODELS = ['opus', 'sonnet', 'haiku', 'fable'];
const MODEL_NAME = { opus: 'Opus', sonnet: 'Sonnet', haiku: 'Haiku', fable: 'Fable' };
// The hub's own notes name models in lower case ("Started Main on opus."); the page shows the product names.
const capModels = (s) => String(s).replace(/\b(opus|sonnet|haiku|fable)\b/g, (w) => MODEL_NAME[w]);
// A hub note is drawn as "text · time": one trailing full stop goes, so it never reads ". ·" (an ellipsis stays).
const noteText = (s) => String(s).replace(/([^.])\.\s*$/, '$1');
// A number keeps its short unit on the same line ("1 s", "412 KB"); agents' "x5" reads as "×5".
const nb = (s) => String(s).replace(/(\d) (ms|s|px|KB|MB|GB|min|h|fps)\b/g, '$1\u00a0$2');
const times = (s) => String(s).replace(/(^|\s)x(\d+)\b/g, '$1×$2');
// A thread the coordinator made: Project chat's routed reply names it (#id).
const routedThread = (id) => S.messages.some((x) => x.thread === 0 && x.kind === 'routed' && new RegExp(`#${id}\\b`).test(x.text));
const MODEL_HINT = { '': 'The coordinator picks per thread', opus: 'Hardest work and design', sonnet: 'Everyday coding', haiku: 'Quick, small jobs', fable: 'If your account has it' };
// Claude's own effort levels.
const THINK = ['low', 'medium', 'high', 'xhigh', 'max'];
const THINK_NAME = { low: 'Low', medium: 'Medium', high: 'High', xhigh: 'xHigh', max: 'Max' };
const THINK_HINT = { low: 'Fastest, least reasoning', medium: 'Balanced', high: 'Thinks hard and checks its work', xhigh: 'Thinks harder on every step', max: 'Deepest (ultrathink)' };
const STATUS = { new: 'Starting', working: 'Working', waiting: 'Needs you', queued: 'Waiting', stalled: 'Stopped', done: 'Done' };
const PALETTE = ['#2f6b4f', '#b4532a', '#8c6a12', '#7a4f86', '#2e6f73', '#9b3d4a', '#5f6b2a', '#4f5b66'];
let proj = { project: 'Dop', owner: 'XIAO' };
const routinePrompt = () => `You are an agent in ${proj.owner}'s ${proj.project} hub. First call hub_start from the ${proj.project} hub connector, with payload set to the full text of the routine-fire payload (or no payload if there is none). Then do exactly what hub_start returns.`;
const STARTERS = [['Fix a bug', 'Fix this bug: '], ['Review a PR', 'Review the latest PR and list anything that needs fixing.'], ['Research', 'Research this and give me a short answer with sources: '], ['Write docs', 'Write or update the docs for: ']];

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

const MD = window.hubMd || null;

// Two shared formatters: toLocaleString builds a new one per call, which a 100-message feed felt on a slow phone.
const CLOCK_DAY = new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit' });
const CLOCK_DATE = new Intl.DateTimeFormat([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const clock = (t) => { const d = new Date(t); return (new Date().toDateString() === d.toDateString() ? CLOCK_DAY : CLOCK_DATE).format(d); };

const ageShort = (ms) => ms < 60e3 ? 'now' : ms < 3600e3 ? `${Math.floor(ms / 60e3)}m` : ms < 86400e3 ? `${Math.floor(ms / 3600e3)}h` : `${Math.floor(ms / 86400e3)}d`;

  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },

try { opts = { ...opts, ...JSON.parse(localStorage.getItem('hub-opts') || '{}') }; } catch {}
const saveOpts = () => { try { localStorage.setItem('hub-opts', JSON.stringify(opts)); } catch {} };

// timeout (ms): give up on a hung read so the Live dot can say so.
// sent: a request already on its way for this op (the first state read, started in <head>).
async function api(op, body, timeout, sent) {
  const res = await (sent || fetch(`/api/hub?op=${op}`, { method: body ? 'POST' : 'GET', headers: { 'x-hub-password': pw, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, signal: timeout ? AbortSignal.timeout(timeout) : undefined }));
  const j = await res.json().catch(() => ({}));
  // Only a wrong password asks again; anything else just retries.

    html = sHead(`Connect ${esc(name)}`) + `<div class="sbody"><ol class="steps">
      <li><b>Copy this link.</b> It works like a key, so keep it private.
        <code class="copyline">${esc(url)}</code><div class="acts"><button class="btn small" data-copy="${esc(url)}">Copy link</button><button class="btn small" data-test="${esc(url)}">Test link</button><button class="btn small" data-newkey="${esc(name)}">New link</button></div><div id="testOut" class="hidden" role="status"></div></li>
      <li><b>Add it on claude.ai</b>, signed in as <b>${esc(name)}</b>: Settings › Connectors › Add custom connector. Name it <i>${P} hub</i>, paste the link, pick <b>No sign-in</b>, then Add (and Connect, if asked).</li>
      ${free ? `<li><b>Use it:</b> in a chat on this account, type <b>check the ${P} hub</b>. It does one task, then asks for the next.</li>` : `<li><b>Make a routine</b> on claude.ai/code: Routines › New routine. Pick the ${P} repo and a model, turn on the ${P} hub connector, add an API trigger and paste this prompt:
        <code class="copyline">${esc(routinePrompt())}</code><div><button class="btn small" data-copy="${esc(routinePrompt())}">Copy prompt</button></div></li>
      <li><b>Save it here:</b> paste the routine's id and token into this account. One routine per model.
        <div><button class="btn small" data-open="edit" data-name="${esc(name)}">Edit ${esc(name)}</button></div></li>`}
    </ol></div>` + sFoot('<button class="btn primary" data-close>Done</button>');
  } else if (kind === 'add' || kind === 'edit') {
    const a = S.accounts.find((x) => x.name === name) || { name: '', plan: 'pro', routines: [] };
    const rows = [...a.routines, { model: 'sonnet', id: '', hasToken: false }];
    html = sHead(kind === 'add' ? 'Add account' : `Edit ${esc(a.name)}`) + `<div class="sbody">
      <div class="sgrp">
        ${fld('Name', `<input id="fName" value="${esc(a.name)}" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" ${kind === 'edit' ? 'readonly' : ''}>`, kind === 'add' ? 'Short, like Main or Helper1.' : '')}
        ${fld('Plan', `<select id="fPlan">${['free', 'pro', 'max', 'team'].map((p) => `<option value="${p}" ${a.plan === p ? 'selected' : ''}>${p[0].toUpperCase() + p.slice(1)}</option>`).join('')}</select>`)}
      </div>
      <div class="sgrp"><h4>Routines</h4><p class="hint">Paid plans: one per model (Connect, step 3).</p>
        <div id="fRoutines">${rows.map(routineRow).join('')}</div>
        <div><button class="btn small" type="button" data-addrow>Add routine</button></div>
      </div>
      <div class="sgrp">${fld('Old connector <i>(optional)</i>', '<input id="fKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Leave empty for a new link">', 'Paste its link to make it work again.')}</div>
      <div class="err" id="fErr" role="alert"></div>
    </div>` + sFoot(`${kind === 'edit' ? `<button class="btn danger" data-remove="${esc(a.name)}">Remove</button>` : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" data-save>${kind === 'add' ? 'Add account' : 'Save'}</button>`);
  } else if (kind === 'usage') {
    const a = S.accounts.find((x) => x.name === name); const u = a?.usage || {};
    html = sHead(`Usage for ${esc(name)}`) + `<div class="sbody">
      <p>Copy the numbers from claude.ai › Settings › Usage, signed in as ${esc(name)}. At ${lowAt()}% used, new work goes to other accounts.</p>
      ${u.at ? `<p class="hint">Now in the boxes: ${esc(useSrc(u)[0].toLowerCase())}, ${esc(since(u.at))}.</p>` : ''}
      <div class="pairs">${fld('5-hour used (%)', `<input id="u5" type="number" inputmode="numeric" min="0" max="100" value="${u.five_hour_pct ?? ''}">`)}
      ${fld('Weekly used (%)', `<input id="u7" type="number" inputmode="numeric" min="0" max="100" value="${u.seven_day_pct ?? ''}">`)}</div>
      <div class="sgrp"><h4>Or just mark it</h4>
        <p>${a?.low ? `${esc(name)} is marked as running low.` : 'New work then goes to other accounts.'}</p>
        <div><button class="btn" data-low="${esc(name)}" data-v="${a?.low ? '0' : '1'}">${a?.low ? 'Mark usage reset' : 'Running low'}</button></div></div>
      <div class="err" id="uErr" role="alert"></div>
    </div>` + sFoot(`<button class="btn" data-close>Cancel</button><button class="btn primary" data-saveusage="${esc(name)}">Save</button>`);
  } else if (kind === 'lessons') {
    html = sHead('Team lessons') + `<div class="sbody">
      <p>Every agent gets a new lesson on its next hub call. Yours win if two disagree.</p>
      <div class="seg" role="group" aria-label="Kind of lesson"><button type="button" data-lkind="do" aria-pressed="${lessonKind === 'do'}">Do</button><button type="button" data-lkind="dont" aria-pressed="${lessonKind === 'dont'}">Don't</button></div>
      ${fld('Lesson', '<textarea id="lText" rows="2" maxlength="280" placeholder="Something every account should know"></textarea>')}
      ${fld('Why <i>(optional)</i>', '<input id="lWhy" maxlength="200" autocomplete="off">')}
      <div class="lacts"><span class="err" id="lErr" role="status"></span><button class="btn primary" data-addlesson>Add lesson</button></div>
      <div class="sgrp"><h4 id="lCount"></h4><div class="lsheet" id="lList"></div></div>
    </div>`;
  } else if (kind === 'settings') {
    const s = S.settings;
    html = sHead('Settings') + `<div class="sbody">
      <div class="sgrp"><h4>Coordinator</h4>
        <div class="pairs">${fld('Model', `<select id="sModel">${MODELS.map((m) => `<option value="${m}" ${s.coordinatorModel === m ? 'selected' : ''}>${MODEL_NAME[m]}</option>`).join('')}</select>`)}
        ${fld('Account', `<select id="sAcct"><option value="">Automatic</option>${S.accounts.map((a) => `<option ${s.coordinatorAccount === a.name ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>`)}</div>
      </div>
      <div class="sgrp"><h4>Limits</h4>
        ${fld('Hub budget per 5 hours (tokens)', `<input id="sBudget" type="number" inputmode="numeric" min="0" step="1000" value="${s.overheadTokens}">`, 'Coordinator and hub messages, not the work. Over it, prompts skip the coordinator.')}
        ${fld('Minimum left for new work (%)', `<input id="sMinLeft" type="number" inputmode="numeric" min="0" max="95" step="1" value="${s.minLeftPct ?? 15}">`, 'Below this (5-hour or weekly), an account gets no new work and its threads hand over.')}
        <label class="pcheck"><input id="sResume" type="checkbox" ${s.autoResume ? 'checked' : ''}><span><b>Continue stopped threads</b><small>On another account</small></span></label>
      </div>
      <div class="sgrp"><h4>After a limit resets</h4>
        <p class="hint">${S.timedWake ? 'Accounts are back at work within a minute of their reset, even with every page closed.' : 'Accounts come back within a minute while this page is open or an agent is working. With everything closed it can take hours.'}</p>${S.timedWake ? '' : '<details class="how"><summary>How to make it always within a minute</summary><p class="hint">In Vercel open dop-hub, Storage, add Upstash QStash (free), connect it to dop-hub, then Redeploy.</p></details>'}
      </div>
      <details class="sdet" id="connDet"><summary>Connection log</summary><div>
        <p class="hint">Last refresh ${speed.rtt} ms, ${speed.ms} ms of it in the hub. Below: each call from claude.ai or an agent, and each routine start, newest first.</p>
        <pre id="connLog">Loading…</pre></div></details>
      <div class="err" id="sErr" role="alert"></div>
    </div>` + sFoot('<button class="btn" data-close>Cancel</button><button class="btn primary" data-savesettings>Save</button>');
  }
  showSheet(html);
  fillLessons();
  // The log is read only when opened (one hub call fewer per Settings visit).
  $('connDet')?.addEventListener('toggle', (e) => {
    if (!e.target.open || e.target.dataset.read) return; e.target.dataset.read = '1';
    api('connlog', {}).then((rows) => {
      const el = $('connLog'); if (!el) return;
      el.textContent = rows.length ? rows.map((r) => `${new Date(r.at).toLocaleTimeString()}  ${r.http} ${r.path || ''}${r.account ? ' account=' + r.account : ''}${r.http === 'START' || r.http === 'USAGE' ? (r.keyOk ? ' OK' : ' FAILED') : r.http === 'POST' || r.account ? (r.keyOk ? ' key OK' : ' key WRONG') : ''}${r.rpc ? ' ' + r.rpc : ''} ${r.via || ''}${r.ua ? '  ' + r.ua : ''}`).join('\n') : 'Nothing has called the hub yet.';
    }).catch((err) => { const el = $('connLog'); if (el) el.textContent = err.message; });
  });
}
function routineRow(r) {
  return `<div class="routine" data-had="${esc(r.hasToken ? r.id : '')}"><select class="rModel" aria-label="Model">${MODELS.map((m) => `<option value="${m}" ${r.model === m ? 'selected' : ''}>${MODEL_NAME[m]}</option>`).join('')}</select>
    <input class="rId" aria-label="Routine id" placeholder="Routine id (trig_…)" value="${esc(r.id)}" autocomplete="off" spellcheck="false">
    <span></span><input class="rToken" type="password" aria-label="Token" autocomplete="off" placeholder="${r.hasToken ? 'Token saved (empty keeps it)' : 'Token (sk-ant-oat01-…)'}">
    <small class="ferr" aria-live="polite"></small></div>`;
}
// Editing a field clears its error.
$('sheetBox').addEventListener('input', (e) => { if (e.target.getAttribute?.('aria-invalid') === 'true') fieldErr(e.target, ''); });
$('sheetBox').addEventListener('click', async (e) => {
  const t = e.target;
  if (t.closest('[data-close]')) return closeSheet();
  const fd = t.closest('[data-fdl]'); if (fd) return downloadFile(fd.dataset.fdl, fd);
  const lk = t.closest('[data-look]');
  if (lk) {
    const { look: k, v } = lk.dataset;
    look[k] = v; applyLook(); if (k === 'motion' && pw) render();
    // Redrawn in place: same scroll, and focus stays on the pressed choice.
    const box = $('sheetBox'), top = box.scrollTop;
    box.innerHTML = lookHtml(); box.scrollTop = top;
    box.querySelector(`[data-look="${k}"][data-v="${v}"]`)?.focus();
    return;
  }
  if (t.closest('[data-copy]')) { try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = 'Copied'; } catch { t.textContent = 'Select and copy it'; } return; }
  if (t.closest('[data-test]')) {
    const out = $('testOut'); out.classList.remove('hidden'); out.style.color = 'var(--soft)'; out.textContent = 'Testing…';
    try {
      const j = await (await fetch(t.dataset.test, { headers: { accept: 'application/json' } })).json();
      out.style.color = j.ok ? 'var(--green)' : 'var(--red)'; out.style.fontWeight = '500';
      out.textContent = j.ok ? `This link works for ${j.account}. Now do step 2.` : `This link doesn't work: ${j.problem || 'unknown problem'}`;
    } catch (err) { out.style.color = 'var(--red)'; out.textContent = `Could not reach the hub: ${err.message}`; }
    return;
  }
  if (t.closest('[data-newkey]')) {
    const n = t.dataset.newkey;
    if (!confirm(`Make a new link for ${n}? Connectors made with the old link stop working, and so do routines that use them, until you add the new link on claude.ai.`)) return;
    await api('account-newkey', { name: n });
    await openSheet('connect', n);
    const out = $('testOut'); out.classList.remove('hidden'); out.style.color = 'var(--green)'; out.style.fontWeight = '500';
    out.textContent = 'New link made. The old one no longer works.';
    return;
  }
  if (t.closest('[data-lkind]')) { lessonKind = t.closest('[data-lkind]').dataset.lkind; document.querySelectorAll('[data-lkind]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lkind === lessonKind)); return; }
  if (t.closest('[data-addlesson]')) {
    const text = $('lText').value.trim(); if (!fieldErr('lText', text ? '' : 'Write the lesson first.')) return firstBad();
    const btn = t.closest('[data-addlesson]'), out = $('lErr');
    await busyBtn(btn, 'Adding…', async () => {
      try {
        const r = await api('lesson', { text, kind: lessonKind, why: $('lWhy').value.trim() });
        $('lText').value = ''; $('lWhy').value = '';
        out.textContent = r.known ? 'The team already has that lesson.' : 'Added.'; out.classList.toggle('ok', !r.known);
        await load(false);
      } catch (err) { if (err.message !== 'auth') { out.textContent = err.message; out.classList.remove('ok'); } }
    });
    return;
  }
  if (t.closest('[data-dellesson]')) {
    if (!confirm('Delete this lesson? New sessions won\'t get it. Agents that already read it keep it until their session ends.')) return;
    const id = Number(t.closest('[data-dellesson]').dataset.dellesson);
    S.lessons = S.lessons.filter((l) => l.id !== id); render();
    await api('lesson-delete', { id }).catch(() => {});
    return load(false).catch(() => {});
  }
  if (t.closest('[data-addrow]')) return $('fRoutines').insertAdjacentHTML('beforeend', routineRow({ model: 'sonnet', id: '' }));
  if (t.closest('[data-remove]')) {
    const n = t.closest('[data-remove]').dataset.remove;
    if (!confirm(`Remove ${n} from the hub? Its connector stops working.`)) return;
    try { await api('account-remove', { name: n }); closeSheet(); load(true); } catch (err) { if (err.message !== 'auth') $('fErr').textContent = err.message; }
    return;
  }
  if (t.closest('[data-save]')) {
    // Checked here first, with the same rules as the hub, so each problem shows under its own field.
    const name = $('fName').value.trim();
    let ok = fieldErr('fName', !name ? 'Type a name.' : /^[A-Za-z0-9][A-Za-z0-9 _-]{0,23}$/.test(name) ? '' : 'Letters, numbers, spaces, - or _, up to 24.');
    // The whole old link works too: only its last part is the key.
    let key = $('fKey').value.trim().replace(/[/?#]+$/, '').split(/[/?#]/).pop();
    ok = fieldErr('fKey', key && !/^[A-Za-z0-9_-]{16,64}$/.test(key) ? 'That is not a connector link or key.' : '') && ok;
    const routines = [];
    for (const r of document.querySelectorAll('.routine')) {
      const id = r.querySelector('.rId').value.trim(), token = r.querySelector('.rToken').value.trim();
      const kept = !!r.dataset.had && r.dataset.had === id;
      const msg = id && !token && !kept ? 'Add its token too, or it is not saved.' : !id && token ? 'Add the routine id too.' : '';
      fieldErr(r.querySelector(msg.startsWith('Add its') ? '.rToken' : '.rId'), msg);
      if (msg) ok = false; else if (id) routines.push({ model: r.querySelector('.rModel').value, id, token });
    }
    if (!ok) return firstBad();
    const btn = t.closest('[data-save]');
    await busyBtn(btn, 'Saving…', async () => {
      try { await api('account', { name, plan: $('fPlan').value, routines, key: key || undefined }); closeSheet(); load(false).then(() => readUsage(true)); }
      catch (err) { if (err.message !== 'auth') $('fErr').textContent = err.message; }
    });
    return;
  }
  if (t.closest('[data-saveusage]')) {
    const pct = (id) => { const el = $(id), v = el.value; return fieldErr(el, el.validity.badInput || (v !== '' && !(Number(v) >= 0 && Number(v) <= 100)) ? '0 to 100, or empty.' : ''); };
    if (![pct('u5'), pct('u7')].every(Boolean)) return firstBad();
    const btn = t.closest('[data-saveusage]');
    await busyBtn(btn, 'Saving…', async () => {
      try { await api('account-usage', { name: btn.dataset.saveusage, five_hour_pct: $('u5').value, seven_day_pct: $('u7').value }); closeSheet(); load(true); }
      catch (err) { if (err.message !== 'auth') $('uErr').textContent = err.message; }
    });
    return;
  }
  if (t.closest('[data-savesettings]')) {
    const num = (id, lo, hi, msg) => { const el = $(id), v = el.value; return fieldErr(el, v === '' || !(Number(v) >= lo && Number(v) <= hi) ? msg : ''); };
    const ok = [num('sBudget', 0, 1e9, 'A number of tokens, 0 or more.'), num('sMinLeft', 0, 95, '0 to 95.')].every(Boolean);
    if (!ok) return firstBad();
    const btn = t.closest('[data-savesettings]');
    await busyBtn(btn, 'Saving…', async () => {
      try { await api('settings', { coordinatorModel: $('sModel').value, coordinatorAccount: $('sAcct').value, overheadTokens: Number($('sBudget').value), minLeftPct: Number($('sMinLeft').value), autoResume: $('sResume').checked }); closeSheet(); load(true); }
      catch (err) { if (err.message !== 'auth') $('sErr').textContent = err.message; }
    });
  }
});

setTab('chat');
// With a saved password the page opens straight away (from the last view)
// and catches up; only a wrong password brings the sign-in box back.
if (pw) {
  showApp(); render(); toBottom();
  load(!S.messages.length).then(() => setLive(true), (e) => e.message !== 'auth' && setLive(false));
  // Usage asks Claude and can be slow; it waits until the last view has painted.
  requestAnimationFrame(() => setTimeout(readUsage));
}
else showLogin();
// Phone keyboard: keep the compose box in view. iOS keeps the layout viewport tall when the keyboard
// opens, so size the app to the visual viewport and hide the tab bar while typing.
if (window.visualViewport) {
  const vv = window.visualViewport, root = document.documentElement;
  const fit = () => {
    const open = innerHeight - vv.height > 120 && matchMedia('(max-width: 860px)').matches;
    root.classList.toggle('kb', open);
    root.style.setProperty('--vvh', open ? vv.height + 'px' : '');
    if (open) scrollTo(0, 0);
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}
</script>
</body>
</html>
