<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
// Look (theme + background) is per device; set it before the page paints. A background
// picture comes from the copy of /walls.css kept on this device, so it paints with no wait.
try {
  const l = JSON.parse(localStorage.getItem('hub-look') || '{}'); if (l.theme) document.documentElement.dataset.theme = l.theme; if (l.bg) document.documentElement.dataset.bg = l.bg;
  const c = l.bg && l.bg !== 'dots' && l.bg !== 'grid' && localStorage.getItem('hub-walls');
  if (c) { const st = document.createElement('style'); st.id = 'wallsCss'; st.textContent = c; document.head.append(st); }
} catch {}
</script>
<style>
:root {
  --bg: #f4f1ec; --panel: #fffdf9; --line: #e3ddd3; --ink: #1d1b18; --soft: #5f594f; --faint: #8c857a;
  --green: #2f6b4f; --on-green: #fff; --amber: #9a6510; --red: #a8372f; --me: #ebe4d8; --sel: #ebe5da; --chip: #f1ece4;
  --shadow: 0 6px 24px rgba(40, 30, 10, .12);
  --clay: rgb(217, 119, 87); --clay-hi: rgb(245, 149, 117); --clay-eye: #1d1b18;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Dark: follows the device under Auto, or forced by Look › Theme (data-theme on <html>). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #171614; --panel: #1f1e1b; --line: #34312c; --ink: #ece8e1; --soft: #b3aca1; --faint: #8c857a;
    --green: #6dbb92; --on-green: #10251a; --amber: #e0a648; --red: #e5786f; --me: #2b2925; --sel: #2c2a26; --chip: #282622;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5); --clay-hi: rgb(235, 159, 127); color-scheme: dark; }
}
:root[data-theme="dark"], :root[data-bg="night"] { --bg: #171614; --panel: #1f1e1b; --line: #34312c; --ink: #ece8e1; --soft: #b3aca1; --faint: #8c857a;
  --green: #6dbb92; --on-green: #10251a; --amber: #e0a648; --red: #e5786f; --me: #2b2925; --sel: #2c2a26; --chip: #282622;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); --clay-hi: rgb(235, 159, 127); color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

/* walls:start (written by node hub/walls.mjs) */
/* Backgrounds (Look › Background): painted behind the whole app and the sign-in page. Dots, Grid and Stones are tinted from the theme; the scenes have their own light and dark versions. */
:root, [data-bg-demo=""] { --wall: none; --wall-size: auto; --wall-bg: var(--bg); --tint: color-mix(in srgb, var(--ink) 9%, transparent); }
:root[data-bg="dots"], [data-bg-demo="dots"] { --wall: radial-gradient(var(--tint) 1.2px, transparent 1.6px); --wall-size: 18px 18px; }
:root[data-bg="grid"], [data-bg-demo="grid"] { --wall: linear-gradient(var(--tint) 1px, transparent 1px), linear-gradient(90deg, var(--tint) 1px, transparent 1px); --wall-size: 26px 26px; }
:root[data-bg="board"], [data-bg-demo="board"] { --wall-bg: #d9ad66; --wall: linear-gradient(rgba(50, 30, 5, .3) 1px, transparent 1px), linear-gradient(90deg, rgba(50, 30, 5, .3) 1px, transparent 1px), var(--w-grain); --wall-size: 44px 44px, 44px 44px, 700px 700px; }
:root[data-bg="stones"], [data-bg-demo="stones"] { --wall: var(--w-stones); --wall-size: 420px 420px; }
:root[data-bg="dawn"], [data-bg-demo="dawn"] { --wall-bg: #bea6b6; --wall: var(--w-dawn); --wall-size: cover; }
:root[data-bg="sea"], [data-bg-demo="sea"] { --wall-bg: #7fa9b9; --wall: var(--w-sea); --wall-size: cover; }
:root[data-bg="forest"], [data-bg-demo="forest"] { --wall-bg: #9db49f; --wall: var(--w-forest); --wall-size: cover; }
:root[data-bg="night"], [data-bg-demo="night"] { --wall-bg: #121a3d; --wall: var(--w-night); --wall-size: cover; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-bg="board"], :root:not([data-theme="light"]) [data-bg-demo="board"] { --wall-bg: #4a3420; --wall: linear-gradient(rgba(240, 205, 150, .16) 1px, transparent 1px), linear-gradient(90deg, rgba(240, 205, 150, .16) 1px, transparent 1px), var(--w-grain-dark); --wall-size: 44px 44px, 44px 44px, 700px 700px; }
  :root:not([data-theme="light"])[data-bg="dawn"], :root:not([data-theme="light"]) [data-bg-demo="dawn"] { --wall-bg: #2a2236; --wall: var(--w-dusk); }
  :root:not([data-theme="light"])[data-bg="sea"], :root:not([data-theme="light"]) [data-bg-demo="sea"] { --wall-bg: #122435; --wall: var(--w-sea-dark); }
  :root:not([data-theme="light"])[data-bg="forest"], :root:not([data-theme="light"]) [data-bg-demo="forest"] { --wall-bg: #14201a; --wall: var(--w-forest-dark); }
}
:root[data-theme="dark"][data-bg="board"], :root[data-theme="dark"] [data-bg-demo="board"] { --wall-bg: #4a3420; --wall: linear-gradient(rgba(240, 205, 150, .16) 1px, transparent 1px), linear-gradient(90deg, rgba(240, 205, 150, .16) 1px, transparent 1px), var(--w-grain-dark); --wall-size: 44px 44px, 44px 44px, 700px 700px; }
:root[data-theme="dark"][data-bg="dawn"], :root[data-theme="dark"] [data-bg-demo="dawn"] { --wall-bg: #2a2236; --wall: var(--w-dusk); }
:root[data-theme="dark"][data-bg="sea"], :root[data-theme="dark"] [data-bg-demo="sea"] { --wall-bg: #122435; --wall: var(--w-sea-dark); }
:root[data-theme="dark"][data-bg="forest"], :root[data-theme="dark"] [data-bg-demo="forest"] { --wall-bg: #14201a; --wall: var(--w-forest-dark); }
/* walls:end */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 16px; }
body { transition: background-color .2s, color .2s; }
#login, .app { background-color: var(--wall-bg); background-image: var(--wall); background-size: var(--wall-size); background-position: center; }
/* Panels over the background: frosted, so the wall carries under the sidebars and header. */
:root { --glass: color-mix(in srgb, var(--panel) 66%, transparent); }
:root:not([data-bg]), :root[data-bg=""] { --glass: var(--panel); }
.side, .team, .head, .tabs { background: var(--glass); -webkit-backdrop-filter: blur(2px) saturate(1.2); backdrop-filter: blur(2px) saturate(1.2); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 16px; transition: border-color .15s, box-shadow .15s; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-size: 15px; font-weight: 600; transition: background-color .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn:hover { background: var(--sel); }
.btn.primary { background: var(--green); color: var(--on-green); border-color: var(--green); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.btn.primary:hover { background: color-mix(in srgb, var(--green) 88%, var(--ink)); }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--sel); }
.err { color: var(--red); font-size: 15px; min-height: 1em; }

/* avatars: one flat colour per account */
.av { --c: var(--faint); width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.av.s { width: 18px; height: 18px; font-size: 10px; }
.av.l { width: 38px; height: 38px; font-size: 17px; }
.avs { display: inline-flex; }
.avs .av + .av { margin-left: -3px; box-shadow: 0 0 0 2px var(--panel); }
.av.hub { background: var(--ink); color: var(--bg); }

/* login */
#login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
#login form { background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 32px; width: min(380px, 100%); display: grid; gap: 14px; }
#login h1 { margin: 0; font-size: 26px; display: flex; align-items: center; gap: 10px; }

/* layout */
.app { --sw: 272px; --tw: 320px; display: grid; grid-template-columns: var(--sw) minmax(0, 1fr) var(--tw); height: 100vh; height: 100dvh; transition: grid-template-columns .22s ease; }
.col { min-height: 0; display: flex; flex-direction: column; }
.side { border-right: 1px solid var(--line); overflow: hidden; }
.team { border-left: 1px solid var(--line); overflow: hidden auto; }
/* Closable sidebars (desktop): the column folds to 0 and its content slides out at full width. */
.side > *, .team > * { min-width: calc(var(--sw) - 1px); }
.team > * { min-width: calc(var(--tw) - 1px); }
.side > .newrow { min-width: calc(var(--sw) - 25px); }
.app[data-side="off"] { --sw: 0px; }
.app[data-team="off"] { --tw: 0px; }
.app[data-side="off"] .side, .app[data-team="off"] .team { visibility: hidden; border-width: 0; transition: visibility 0s .22s; }
.pbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 8px; color: var(--soft); flex: none; }
.pbtn:hover { color: var(--ink); }
.pbtn svg { width: 19px; height: 19px; }
.brand .pbtn, .thead .pbtn { margin-right: -6px; }
.head .pbtn[aria-pressed="true"] { display: none; }
@media (prefers-reduced-motion: reduce) { .app { transition: none; } }

/* sidebar */
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
.brand b { font-size: 19px; white-space: nowrap; }
/* The logo (hub/logo.svg): a cream D with an amber echo on a navy tile. */
.logo { width: 28px; height: 28px; flex: none; display: inline-block; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f2a44'/><path d='M21 14h12a18 18 0 0 1 0 36H21z' fill='none' stroke='%23f2b84b' stroke-width='5' stroke-linejoin='round' transform='translate(5 3)' opacity='.55'/><path d='M17 14h12a18 18 0 0 1 0 36H17z' fill='none' stroke='%23f6efe2' stroke-width='5' stroke-linejoin='round'/></svg>") center / contain no-repeat; }
.logo.l { width: 40px; height: 40px; }
.logo.hero { width: 72px; height: 72px; }
/* Over a background the welcome text sits on frosted glass, so it stays readable on every scene. */
:root[data-bg]:not([data-bg=""]) .hello { background: var(--glass); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); border-radius: 18px; padding: 28px 32px; box-shadow: var(--shadow); }
:root[data-bg]:not([data-bg=""]) .note { align-self: center; max-width: 100%; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 10px; padding: 5px 12px; }
.live { margin-left: auto; white-space: nowrap; font-size: 14px; color: var(--green); font-weight: 600; }
.live.off { color: var(--red); }
.newrow { margin: 4px 12px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.newtask { text-align: left; display: flex; gap: 8px; align-items: center; padding-left: 11px; padding-right: 8px; white-space: nowrap; }
.newtask span { font-size: 19px; line-height: 1; }
.newtask svg { width: 16px; height: 16px; flex: none; }
.studio-link { grid-column: 1 / -1; text-decoration: none; color: inherit; }
.newtask[aria-pressed="true"] { background: var(--sel); border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.list { overflow-y: auto; padding: 4px 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.group { font-size: 13px; font-weight: 700; color: var(--faint); padding: 14px 10px 4px; text-transform: uppercase; letter-spacing: .05em; }
.trow { text-align: left; border: 0; background: none; border-radius: 6px; padding: 9px 10px; display: grid; gap: 4px; width: 100%; }
.trow:hover, .trow.on { background: var(--sel); }
.trow .ttl { font-weight: 600; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tsub { display: flex; gap: 7px; align-items: center; font-size: 14px; min-width: 0; }
.trow .tsub .when { margin-left: auto; color: var(--soft); white-space: nowrap; }
.stx { font-weight: 600; white-space: nowrap; }
.st-working .stx, .st-new .stx { color: var(--green); }
.st-waiting .stx { color: var(--amber); }
.st-queued .stx { color: var(--amber); }
.st-stalled .stx { color: var(--red); }
.st-done .stx { color: var(--soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.st-working .dot, .st-new .dot { background: var(--green); }
.st-waiting .dot, .st-queued .dot { background: var(--amber); }
.st-stalled .dot { background: var(--red); }

/* main */
.main { min-width: 0; }
.head { display: flex; align-items: center; gap: 10px; padding: 12px 24px; border-bottom: 1px solid var(--line); min-height: 60px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 19px; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: var(--chip); }
.head a { color: var(--green); font-size: 15px; font-weight: 600; }
.back { display: none; }
.feed { flex: 1; overflow-y: auto; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 16px; }
.feed > * { width: 100%; max-width: 820px; margin-left: auto; margin-right: auto; animation: rise .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .feed > * { animation: none; } }

/* Claude-style thinking: ✻ spinner, shimmering verb, elapsed time (frames, verbs and colours from Claude Code) */
.thinking { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--clay); min-width: 0; }
.spin { display: inline-flex; align-items: center; justify-content: center; width: 1.1em; height: 1.1em; color: var(--clay); flex: none; vertical-align: -0.15em; }
.star { display: inline-block; width: 1em; height: 1em; margin-right: 4px; color: var(--clay); vertical-align: -0.15em; }
.spin svg, .star svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.thinking .verb { font-weight: 600; background: linear-gradient(90deg, var(--clay) 0 40%, var(--clay-hi) 50%, var(--clay) 60% 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
.thinking .tmeta { color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.trow .spin { font-size: 14px; width: 9px; }
/* agents' thinking notes, folded like Claude's "Thought process" */
.thought { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; color: var(--soft); }
.thought summary { cursor: pointer; font-size: 14px; display: flex; gap: 8px; align-items: center; list-style: none; }
.thought summary::-webkit-details-marker { display: none; }
.thought summary::after { content: '›'; font-size: 16px; transition: transform .15s; }
.thought[open] summary::after { transform: rotate(90deg); }
.thought summary b { color: var(--ink); font-weight: 600; }
.thought .text { font-size: 15px; margin-top: 4px; }
.thoughts-hidden { font-size: 13px; }
/* Clawd, Claude Code's mascot, redrawn from its terminal sprite */
.clawd { width: 36px; height: 20px; flex: none; overflow: visible; }
.clawd.s { width: 22px; height: 12px; }
.clawd.l { width: 108px; height: 60px; }
.clawd .cl-body, .clawd .cl-legs { fill: var(--clay); }
.clawd .cl-eyes { fill: var(--clay-eye); }
.clawd g, .clawd rect { transform-box: fill-box; transform-origin: center bottom; }
.clawd .cl-eyes { transform-origin: center; animation: cl-blink 4.2s infinite; }
.clawd .cl-up { animation: cl-bob 1.8s steps(2, jump-none) infinite; }
.clawd.busy .cl-up { animation: none; }
.clawd.busy .lg.a { animation: cl-step .36s steps(2, jump-none) infinite; }
.clawd.busy .lg.b { animation: cl-step .36s steps(2, jump-none) infinite reverse; }
.clawd.busy .cl-arm { animation: cl-arm .36s steps(2, jump-none) infinite; }
.clawd.busy .cl-arm.r { animation-direction: reverse; }
.clawd.wave .cl-arm.r { animation: cl-wave .9s steps(2, jump-none) infinite; }
@keyframes cl-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
@keyframes cl-bob { from { transform: translateY(0); } to { transform: translateY(-.6px); } }
@keyframes cl-step { from { transform: translateY(0); } to { transform: translateY(-1px); } }
@keyframes cl-arm { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
@keyframes cl-wave { from { transform: translateY(0); } to { transform: translateY(-3px); } }
.stroll { display: block; animation: cl-stroll 9s ease-in-out infinite; }
@keyframes cl-stroll { 0%, 100% { transform: translateX(-40px); } 45%, 55% { transform: translateX(40px); } }
@media (prefers-reduced-motion: reduce) { .clawd *, .stroll, .thinking .verb { animation: none !important; } }
.row { display: flex; gap: 10px; align-items: flex-start; }
.row.me { justify-content: flex-end; }
.bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 11px 15px; min-width: 0; max-width: 100%; box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px -6px rgba(0, 0, 0, .12); }
.row.me .bubble { background: var(--me); border-color: transparent; border-radius: 14px 4px 14px 14px; max-width: 78%; box-shadow: none; }
.who { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
.who .when { font-weight: 400; color: var(--soft); }
.label { font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--chip); }
.label.q { background: var(--amber); color: #fff; }
.ask { display: grid; gap: 10px; margin-top: 8px; }
.ask-q { border-top: 1px solid var(--line); padding-top: 8px; }
.ask-h { font-size: 13px; font-weight: 700; color: var(--soft); }
.ask-o { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 8px 12px; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; font: inherit; color: inherit; cursor: pointer; }
.ask-o small { display: block; color: var(--soft); }
.ask-o.on { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.ask-t { width: 100%; margin-top: 6px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; font: inherit; }
.ask-go { justify-self: start; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--green); color: var(--on-green); font: inherit; font-weight: 700; cursor: pointer; }
.ask-done { color: var(--soft); font-size: 14px; }
.label.ok { background: var(--green); color: var(--on-green); }
.text { white-space: pre-wrap; word-wrap: break-word; line-height: 1.55; }
.pic { display: block; max-width: 100%; border-radius: 10px; margin-top: 8px; background: var(--line); min-height: 40px; }
.text a, .bubble a { color: var(--green); }
.picks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; justify-content: flex-end; }
.picks span { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--panel); }
/* swipe a message left (or use its ⋯ on a computer) to show Delete */
.sw { position: relative; overflow: hidden; flex: none; }
.sw-in { position: relative; z-index: 1; transition: transform .18s ease; touch-action: pan-y; }
.sw.drag .sw-in { transition: none; }
.sw.open .sw-in { transform: translateX(-104px); }
.sw-del { position: absolute; right: 0; top: 50%; transform: translateY(-50%); opacity: 0; pointer-events: none; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--red); color: var(--panel); font: inherit; font-size: 15px; font-weight: 700; transition: opacity .15s; }
.sw.open .sw-del, .sw.drag .sw-del { opacity: 1; pointer-events: auto; }
.sw-x { position: absolute; top: 2px; right: 2px; z-index: 2; opacity: 0; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: var(--panel); color: var(--soft); font: inherit; font-size: 15px; line-height: 1.3; }
.sw:hover .sw-x, .sw-x:focus-visible { opacity: 1; }
.sw.open .sw-x { opacity: 0; pointer-events: none; }

    for (let i = 1; i < (first.chunks || 1); i++) { btn.textContent = `Download ${Math.round((i / first.chunks) * 100)}%`; parts.push((await api(`lib-raw&id=${encodeURIComponent(id)}&part=body&i=${i}`)).data); }
    const blobs = await Promise.all(parts.map(async (d) => (await fetch(`data:application/octet-stream;base64,${d}`)).blob()));
    const url = URL.createObjectURL(new Blob(blobs, { type: first.type || 'application/octet-stream' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: f?.name || id });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60_000);

    setTimeout(() => { cp.textContent = 'Copy'; cp.classList.remove('done'); }, 1500);
    return;
  }
  const ak = e.target.closest('[data-ask]');
  if (ak) {
    const [id, qi, oi] = ak.dataset.ask.split(':').map(Number); const m = S.messages.find((x) => x.id === id); const q = m.meta.questions[qi]; const label = q.options[oi].label;
    const v = askSel[id][qi]; v.picks = q.multiSelect ? (v.picks.includes(label) ? v.picks.filter((l) => l !== label) : [...v.picks, label]) : v.picks[0] === label ? [] : [label];
    return renderFeed();
  }
  const ag = e.target.closest('[data-ask-go]'); if (ag) return askSend(Number(ag.dataset.askGo));
  if (e.target.closest('[data-attach]')) return $('fileIn').click();
  const fo = e.target.closest('[data-fopen]'); if (fo) return openFile(fo.dataset.fopen);
  const md = e.target.closest('[data-mdel]'); if (md) return deleteMsg(Number(md.dataset.mdel));
  const mm = e.target.closest('[data-mmenu]'); if (mm) return setOpen(openMsg === Number(mm.dataset.mmenu) ? null : Number(mm.dataset.mmenu));
  if (openMsg != null) { setOpen(null); if (e.target.closest('.sw')) return; }
  const th = e.target.closest('[data-thread]'); if (th) return openThread(Number(th.dataset.thread));
  const tab = e.target.closest('#tabs button'); if (tab) return setTab(tab.dataset.tab);
  if (e.target.closest('#back')) return setTab('threads');
  const pn = e.target.closest('[data-panel]'); if (pn) return togglePanel(pn.dataset.panel);
  if (e.target.closest('#newTask')) { openThread(0); $('text').focus(); return; }
  if (e.target.closest('#newChat')) { openThread(NEW_CHAT); $('text').focus(); return; }
  const pp = e.target.closest('[data-pop]'); if (pp) { if (popKind === pp.dataset.pop) return closePop(); return openPop(pp.dataset.pop, pp); }
  const tg = e.target.closest('[data-toggle="direct"]'); if (tg) { opts.direct = !opts.direct; saveOpts(); return renderTools(null); }
  const st = e.target.closest('[data-starter]'); if (st) { $('text').value = st.dataset.starter; drafts[sel] = st.dataset.starter; grow(); $('text').focus(); return; }
  if (e.target.closest('[data-refresh]')) { e.target.textContent = 'Reading…'; await readUsage(true); return; }
  if (e.target.closest('[data-archived]')) { showArchived = !showArchived; return renderSide(); }
  const op = e.target.closest('[data-open]'); if (op) return openSheet(op.dataset.open, op.dataset.name);
  const low = e.target.closest('[data-low]'); if (low) { await api('account-low', { name: low.dataset.low, low: low.dataset.v === '1', note: 'marked on the page' }); closeSheet(); return load(true); }
  const act = e.target.closest('[data-act]');
  if (act) return threadAction(act.dataset.act);
  if (e.target === $('sheet')) closeSheet();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePop(); closeSheet(); setOpen(null); }
  // [ and ] fold the threads and team sidebars, unless typing.
  if ((e.key === '[' || e.key === ']') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest('input, textarea, select, [contenteditable]')) togglePanel(e.key === '[' ? 'side' : 'team');
});
// Swipe left on a message (touch or pen) to show its Delete button; swipe right or tap elsewhere to hide it.
let drag = null, swiped = 0;
$('feed').addEventListener('pointerdown', (e) => {
  const sw = e.target.closest('.sw');
  if (e.pointerType === 'mouse' || !sw || e.target.closest('.sw-del')) return;
  drag = { sw, id: Number(sw.dataset.mid), x: e.clientX, y: e.clientY, base: sw.classList.contains('open') ? -104 : 0, at: null };
});
$('feed').addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.at == null) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (Math.abs(dx) < 10) return;
    drag.sw.classList.add('drag');
  }
  drag.at = Math.max(-150, Math.min(0, drag.base + dx));
  drag.sw.querySelector('.sw-in').style.transform = `translateX(${drag.at}px)`;
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.at == null) return;
  swiped = Date.now();
  d.sw.classList.remove('drag'); d.sw.querySelector('.sw-in').style.transform = '';
  setOpen(d.at < -50 ? d.id : openMsg === d.id ? null : openMsg);
}
$('feed').addEventListener('pointerup', endDrag);
$('feed').addEventListener('pointercancel', endDrag);
$('feed').addEventListener('input', (e) => { const o = e.target.closest?.('[data-ask-other]'); if (o) { const [id, qi] = o.dataset.askOther.split(':').map(Number); askSel[id][qi].other = o.value; } });
$('text').addEventListener('input', () => { drafts[sel] = $('text').value; grow(); });
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer: fine)').matches) { e.preventDefault(); $('compose').requestSubmit(); } });
let sendingNow = false;
$('compose').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (sendingNow) return;
  const from = sel, list = attOf(sel);
  if (!$('text').value.trim() && !list.length) return;
  // Files upload as soon as they are picked; Send waits for any still going.
  if (list.some((f) => f.status === 'up')) {
    sendingNow = true; attNote('Uploading… sends when done.', true);
    await Promise.all(list.map((f) => f.job));
    sendingNow = false; attNote('');
    if (sel !== from) return;
  }
  if (list.some((f) => f.status === 'err')) return attNote('A file did not upload. Remove it (×) and add it again, then send.');
  const text = $('text').value.trim();
  if (!text && !list.length) return;
  const files = list.map((f) => ({ id: f.id, name: f.name, kind: f.kind, size: f.size, local: f.url || '' }));
  $('text').value = ''; drafts[sel] = ''; grow(); att[sel] = []; renderAtt();
  const picks = { model: opts.model || undefined, thinking: opts.thinking, accounts: opts.accounts, team: opts.team || 1 };
  const ids = files.map((f) => f.id);
  const body = sel > 0 ? { text, thread: sel, files: ids } : sel === NEW_CHAT ? { text, chat: true, files: ids, ...picks } : { text, thread: 0, direct: opts.direct, files: ids, ...picks };
  // Show it straight away; starting the agents happens while it says Sending.
  S.messages.push({ id: `tmp${++tmp}`, at: Date.now(), thread: sel, from: 'XIAO', kind: 'prompt', text, meta: { ...(sel > 0 ? {} : body), files }, pending: true });
  renderFeed(); toBottom();
  let made = null;
  try { made = await api('prompt', body); } catch (err) { if (err.message !== 'auth') { alert(err.message); $('text').value = text; att[from] = list; renderAtt(); } }
  S.messages = S.messages.filter((m) => !m.pending);
  // A new chat opens its thread once the hub has made it (unless XIAO already moved on).
  if (from === NEW_CHAT && made?.thread) { await load(false).catch(() => {}); if (sel === NEW_CHAT) openThread(made.thread); return; }
  load(false).catch(() => renderFeed());
});

// ---------- look (per device) ----------
const THEMES = [['', 'Auto'], ['light', 'Light'], ['dark', 'Dark']];
const WALLS = [['', 'Plain'], ['dots', 'Dots'], ['grid', 'Grid'], ['board', 'Go board'], ['stones', 'Stones'], ['dawn', 'Dawn'], ['sea', 'Sea'], ['forest', 'Forest'], ['night', 'Night sky']];
let look = { theme: '', bg: '' };
try { look = { ...look, ...JSON.parse(ls.get('hub-look') || '{}') }; } catch {}
// The background pictures (hub/walls.css, written by hub/walls.mjs, ~20 KB zipped) load only
// when a background or the Look sheet needs them. A device showing a picture keeps a copy
// (hub-walls) that the next load paints from at once, then checks for a newer one.
const needsPics = (bg) => !!bg && bg !== 'dots' && bg !== 'grid';
let wallsP = null;
function loadWalls() {
  return wallsP ||= fetch('/walls.css').then((r) => (r.ok ? r.text() : Promise.reject(new Error(r.status)))).then((css) => {
    let el = $('wallsCss');
    if (!el) { el = document.createElement('style'); el.id = 'wallsCss'; document.head.append(el); }
    if (el.textContent !== css) el.textContent = css;
    keepWalls();
  }).catch(() => { wallsP = null; });
}
function keepWalls() {
  if (!needsPics(look.bg)) return ls.del('hub-walls');
  const css = $('wallsCss')?.textContent;
  if (wallsP && css && ls.get('hub-walls') !== css) ls.set('hub-walls', css);
}
function applyLook() {
  const r = document.documentElement;
  if (look.theme) r.dataset.theme = look.theme; else delete r.dataset.theme;
  if (look.bg) r.dataset.bg = look.bg; else delete r.dataset.bg;
  ls.set('hub-look', JSON.stringify(look));
  // Painted from the kept copy: refresh it once the page has settled; else read it now.
  if (needsPics(look.bg) && !wallsP) { if ($('wallsCss')) setTimeout(loadWalls, 4000); else loadWalls(); }
  keepWalls();
  // Phone status bar follows the page colour.
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(r).getPropertyValue('--panel').trim() || '#f4f1ec';
}
applyLook();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyLook);
function lookHtml() {
  return `<h3>Look</h3><p>Saved on this device only.</p>
    <div class="sect">Theme</div>
    <div class="seg">${THEMES.map(([v, n]) => `<button type="button" data-look="theme" data-v="${v}" aria-pressed="${look.theme === v}">${n}</button>`).join('')}</div>
    <p>Auto follows your phone or computer. Night sky is always dark.</p>
    <div class="sect">Background</div>
    <div class="walls">${WALLS.map(([v, n]) => `<button type="button" data-look="bg" data-v="${v}" aria-pressed="${look.bg === v}"><i data-bg-demo="${v}"></i>${n}</button>`).join('')}</div>
    <div class="acts"><button class="btn primary" data-close>Done</button></div>`;
}

// ---------- sheets ----------

    const k = await api(`connect&account=${encodeURIComponent(name)}`);
    const url = `${location.origin}/api/c/${encodeURIComponent(k.name)}/${encodeURIComponent(k.key)}`;
    const free = S.accounts.find((a) => a.name === name)?.plan === 'free';
    html = `<h3>Connect ${esc(name)}</h3>
      <p><b>Step 1.</b> Copy this link. It works like a key, so keep it private.</p>

      <p><b>Step 2.</b> On claude.ai or the Claude app, signed in as <b>${esc(name)}</b>: Settings › Connectors › Add custom connector. Name it <i>${esc(proj.project)} hub</i>, paste the link. Under sign-in, tick <b>No sign-in</b> (it says Detected), then press Add. If a Connect button appears, press it. No sign-in page should open.</p>
      ${free ? `<p><b>To use it:</b> open a chat on this account and type <b>check the ${esc(proj.project)} hub</b>. It does one task, then asks for the next.</p>` : `<p><b>Step 3.</b> On claude.ai/code: Routines › New routine. Pick the ${esc(proj.project)} repo and a model, turn on the ${esc(proj.project)} hub connector, add an API trigger, and paste this prompt:</p>
      <code class="copyline">${esc(routinePrompt())}</code><div><button class="btn small" data-copy="${esc(routinePrompt())}">Copy prompt</button></div>
      <p><b>Step 4.</b> Press Edit on this account here and paste the routine's id and token. Repeat steps 3 and 4 for each model you want.</p>`}
      <div class="acts"><button class="btn primary" data-close>Done</button></div>`;
  } else if (kind === 'add' || kind === 'edit') {
    const a = S.accounts.find((x) => x.name === name) || { name: '', plan: 'pro', routines: [] };
    const rows = [...a.routines, { model: 'sonnet', id: '', hasToken: false }];
    html = `<h3>${kind === 'add' ? 'Add account' : 'Edit ' + esc(a.name)}</h3>
      <label class="field">Name (short, like Main or Helper1)<input id="fName" value="${esc(a.name)}" ${kind === 'edit' ? 'readonly' : ''} required></label>
      <label class="field">Plan<select id="fPlan">${['free', 'pro', 'max', 'team'].map((p) => `<option ${a.plan === p ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
      <label class="field">Old connector key (optional: paste the last part of an old link to make that connector work again)<input id="fKey" autocomplete="off" placeholder="Leave empty for a new key"></label>
      <div class="sect">Routines (paid plans): one per model</div>
      <div id="fRoutines">${rows.map(routineRow).join('')}</div>
      <div><button class="btn small" type="button" data-addrow>Add another routine</button></div>
      <div class="err" id="fErr"></div>
      <div class="acts"><button class="btn primary" data-save>Save</button><button class="btn" data-close>Cancel</button>${kind === 'edit' ? `<button class="btn" data-remove="${esc(a.name)}">Remove account</button>` : ''}</div>`;
  } else if (kind === 'usage') {
    const a = S.accounts.find((x) => x.name === name); const u = a?.usage || {};
    html = `<h3>Usage for ${esc(name)}</h3>
      <p>Use this when Claude doesn't share the numbers (free plans, or a refused token). You can see them on claude.ai › Settings › Usage, signed in as ${esc(name)}. At ${lowAt()}% (less than ${100 - lowAt()}% left; change it in Settings) the hub moves new work to other accounts.</p>
      <div class="pairs"><label class="field">5-hour limit used (%)<input id="u5" type="number" min="0" max="100" value="${u.five_hour_pct ?? ''}"></label>
      <label class="field">Weekly limit used (%)<input id="u7" type="number" min="0" max="100" value="${u.seven_day_pct ?? ''}"></label></div>
      <div class="acts"><button class="btn primary" data-saveusage="${esc(name)}">Save</button><button class="btn" data-close>Cancel</button></div>
      <div class="sect">Or just tell the hub</div>
      <p>${a?.low ? `${esc(name)} is marked as running low, so new work goes to other accounts.` : `Running low marks ${esc(name)} as nearly out, so new work goes to other accounts.`}</p>
      <div class="acts"><button class="btn" data-low="${esc(name)}" data-v="${a?.low ? '0' : '1'}">${a?.low ? 'Usage is back' : 'Running low'}</button></div>`;
  } else if (kind === 'lessons') {
    html = `<h3>Team lessons</h3>
      <p>A new lesson reaches every agent on its next hub call, and every new session starts with all of them. Yours win if two disagree.</p>
      <label class="field">New lesson<textarea id="lText" rows="2" maxlength="280" placeholder="Something every account should know"></textarea></label>
      <div class="acts"><button type="button" class="chip" data-lkind="do" aria-pressed="${lessonKind === 'do'}">Do</button><button type="button" class="chip" data-lkind="dont" aria-pressed="${lessonKind === 'dont'}">Don't</button></div>
      <label class="field">Why (optional)<input id="lWhy" maxlength="200" autocomplete="off"></label>
      <div class="err" id="lErr"></div>
      <div class="acts"><button class="btn primary" data-addlesson>Add lesson</button><button class="btn" data-close>Close</button></div>
      <div class="sect" id="lCount"></div>
      <div class="lsheet" id="lList"></div>`;
  } else if (kind === 'settings') {
    const s = S.settings;
    html = `<h3>Settings</h3>
      <label class="field">Coordinator model<select id="sModel">${MODELS.map((m) => `<option value="${m}" ${s.coordinatorModel === m ? 'selected' : ''}>${MODEL_NAME[m]}</option>`).join('')}</select></label>
      <label class="field">Coordinator account<select id="sAcct"><option value="">Pick automatically</option>${S.accounts.map((a) => `<option ${s.coordinatorAccount === a.name ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label>
      <label class="field">Hub overhead budget per 5 hours (tokens)<input id="sBudget" type="number" min="0" step="1000" value="${s.overheadTokens}"></label>

    }).catch((e) => { const el = $('connLog'); if (el) el.textContent = e.message; });
  }

function routineRow(r) {
  return `<div class="routine"><select class="rModel">${MODELS.map((m) => `<option value="${m}" ${r.model === m ? 'selected' : ''}>${MODEL_NAME[m]}</option>`).join('')}</select>
    <input class="rId" placeholder="Routine id (trig_...)" value="${esc(r.id)}">
    <span></span><input class="rToken" type="password" placeholder="${r.hasToken ? 'Token saved (leave empty to keep)' : 'Token (sk-ant-oat01-...)'}"></div>`;

$('sheetBox').addEventListener('click', async (e) => {
  const t = e.target;
  if (t.closest('[data-close]')) return closeSheet();
  const fd = t.closest('[data-fdl]'); if (fd) return downloadFile(fd.dataset.fdl, fd);
  const lk = t.closest('[data-look]'); if (lk) { look[lk.dataset.look] = lk.dataset.v; applyLook(); $('sheetBox').innerHTML = lookHtml(); return; }
  if (t.closest('[data-copy]')) { try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = 'Copied'; } catch { t.textContent = 'Select and copy it'; } return; }
  if (t.closest('[data-test]')) {
    const out = $('testOut'); out.classList.remove('hidden'); out.style.color = 'var(--soft)'; out.textContent = 'Testing…';
    try {
      const j = await (await fetch(t.dataset.test, { headers: { accept: 'application/json' } })).json();
      out.style.color = j.ok ? 'var(--green)' : 'var(--red)'; out.style.fontWeight = '600';
      out.textContent = j.ok ? `This link works for ${j.account}. Now do step 2.` : `This link doesn't work: ${j.problem || 'unknown problem'}`;
    } catch (err) { out.style.color = 'var(--red)'; out.textContent = `Could not reach the hub: ${err.message}`; }
    return;
  }
  if (t.closest('[data-newkey]')) {
    const n = t.dataset.newkey;
    if (!confirm(`Make a new link for ${n}? Connectors made with the old link stop working, and so do routines that use them, until you add the new link on claude.ai.`)) return;
    await api('account-newkey', { name: n });
    await openSheet('connect', n);
    const out = $('testOut'); out.classList.remove('hidden'); out.style.color = 'var(--green)'; out.style.fontWeight = '600';
    out.textContent = 'New link made. The old one no longer works.';
    return;
  }
  if (t.closest('[data-lkind]')) { lessonKind = t.closest('[data-lkind]').dataset.lkind; document.querySelectorAll('[data-lkind]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lkind === lessonKind)); return; }
  if (t.closest('[data-addlesson]')) {
    const text = $('lText').value.trim(); if (!text) { $('lText').focus(); return; }
    try {
      const r = await api('lesson', { text, kind: lessonKind, why: $('lWhy').value.trim() });
      $('lText').value = ''; $('lWhy').value = '';
      $('lErr').textContent = r.known ? 'The team already has that lesson.' : '';
      await load(false);
    } catch (err) { if (err.message !== 'auth') $('lErr').textContent = err.message; }
    return;
  }
  if (t.closest('[data-dellesson]')) {
    if (!confirm('Delete this lesson? New sessions won\'t get it. Agents that already read it keep it until their session ends.')) return;
    const id = Number(t.closest('[data-dellesson]').dataset.dellesson);
    S.lessons = S.lessons.filter((l) => l.id !== id); render();
    await api('lesson-delete', { id }).catch(() => {});
    return load(false).catch(() => {});
  }
  if (t.closest('[data-addrow]')) return $('fRoutines').insertAdjacentHTML('beforeend', routineRow({ model: 'sonnet', id: '' }));
  if (t.closest('[data-remove]')) { if (confirm('Remove this account from the hub?')) { await api('account-remove', { name: t.dataset.remove }); closeSheet(); load(true); } return; }
  if (t.closest('[data-save]')) {
    const routines = [...document.querySelectorAll('.routine')].map((r) => ({ model: r.querySelector('.rModel').value, id: r.querySelector('.rId').value.trim(), token: r.querySelector('.rToken').value.trim() })).filter((r) => r.id);
    try { await api('account', { name: $('fName').value.trim(), plan: $('fPlan').value, routines, key: $('fKey').value.trim() || undefined }); closeSheet(); load(false).then(() => readUsage(true)); } catch (err) { $('fErr').textContent = err.message; }
    return;
  }
  if (t.closest('[data-saveusage]')) { await api('account-usage', { name: t.dataset.saveusage, five_hour_pct: $('u5').value, seven_day_pct: $('u7').value }); closeSheet(); return load(true); }
  if (t.closest('[data-savesettings]')) {
    await api('settings', { coordinatorModel: $('sModel').value, coordinatorAccount: $('sAcct').value, overheadTokens: Number($('sBudget').value), minLeftPct: Number($('sMinLeft').value), autoResume: $('sResume').checked });
    closeSheet(); load(true);
  }
});

setTab('chat');
$('loginForm').querySelector('h1').insertAdjacentHTML('beforeend', clawd('wave'));
// With a saved password the page opens straight away (from the last view)
// and catches up; only a wrong password brings the sign-in box back.
if (pw) {
  showApp(); render(); toBottom();
  load(!S.messages.length).then(() => setLive(true), (e) => e.message !== 'auth' && setLive(false));
