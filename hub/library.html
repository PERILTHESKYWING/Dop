<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#27221c" media="(prefers-color-scheme: dark)">
<title>Hub library</title>
<link rel="icon" href="/logo.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
try { const l = JSON.parse(localStorage.getItem('hub-look') || '{}'); if (l.theme) document.documentElement.dataset.theme = l.theme; } catch {}
</script>
<style>
/* Kaya look: honey-kaya sidebar and page headers, cream middle, black-stone main buttons (white stones in dark), Alegreya Sans. */
@font-face { font-family: "Alegreya Sans"; src: url(/fonts/alegreya-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Alegreya Sans"; src: url(/fonts/alegreya-sans-latin-500-normal.woff2) format("woff2"); font-weight: 500 600; font-display: swap; }
@font-face { font-family: "Alegreya Sans"; src: url(/fonts/alegreya-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700 900; font-display: swap; }
:root {
  --font: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #faf6ee; --panel: #ffffff; --line: #e8dfcf; --line-2: #d3c4a8; --ink: #22190f; --soft: #5e5040; --faint: #6a5a46;
  --kaya: #f0dcb3; --kaya-2: #dcb676; --kaya-ink: #2b1d0e; --kaya-line: #d8bb85; --kaya-amber: #7a4300; --kaya-green: #1d5e37;
  --stone: #1f1b17; --on-stone: #fbf7f0; --stone-edge: #000;
  --green: #2c7a4b; --on-green: #fff; --amber: #9a5a00; --on-amber: #fff; --red: #b3352b;
  --me: #f4e4c4; --sel: #f3ead9; --chip: #f6efe2; --r: 6px;
  --shadow: 0 8px 28px rgba(60, 40, 10, .16);
  font-family: var(--font);
}
/* Dark: follows the device under Auto, or forced by Look › Theme (data-theme on <html>). White stones, dark wood. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1d1915; --panel: #27221c; --line: #3b332a; --line-2: #54483a; --ink: #f6efe4; --soft: #cdbfab; --faint: #a39480;
    --kaya: #4a3520; --kaya-2: #5a4128; --kaya-ink: #f8e9cf; --kaya-line: #6b4f31; --kaya-amber: #ffc46b; --kaya-green: #8fe0b0;
    --stone: #f3efe7; --on-stone: #1b1712; --stone-edge: #b9b1a3;
    --green: #67c992; --on-green: #0d2416; --amber: #f0b44e; --on-amber: #241500; --red: #f08070; --me: #4a3520; --sel: #322a22; --chip: #2f2821;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1d1915; --panel: #27221c; --line: #3b332a; --line-2: #54483a; --ink: #f6efe4; --soft: #cdbfab; --faint: #a39480;
  --kaya: #4a3520; --kaya-2: #5a4128; --kaya-ink: #f8e9cf; --kaya-line: #6b4f31; --kaya-amber: #ffc46b; --kaya-green: #8fe0b0;
  --stone: #f3efe7; --on-stone: #1b1712; --stone-edge: #b9b1a3;
  --green: #67c992; --on-green: #0d2416; --amber: #f0b44e; --on-amber: #241500; --red: #f08070; --me: #4a3520; --sel: #322a22; --chip: #2f2821;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
/* ===== Kaya look (T1 Looks): same wood, stones and type as the hub. The :root prefix lifts these over the page rules below. ===== */
:root body { font: 16px/1.45 var(--font); font-variant-numeric: lining-nums; -webkit-font-smoothing: antialiased; }
:root .btn { border-radius: var(--r); border-color: var(--line-2); border-bottom-width: 2px; font-weight: 500; }
:root .btn.go { background: var(--stone); color: var(--on-stone); border: 1px solid var(--stone-edge); border-bottom-width: 2px; }
:root .btn.go:hover { background: color-mix(in srgb, var(--stone) 85%, var(--bg)); filter: none; }
:root .btn.go:disabled:hover { background: var(--stone); }
:root .btn.seg[aria-pressed="true"] { border-color: var(--stone); background: var(--sel); }
:root .top { background: var(--kaya); color: var(--kaya-ink); border-bottom-color: var(--kaya-line); min-height: 56px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: 6px; }
:root .top h1, :root dialog h2 { font: 700 22px/1.1 var(--font); }
:root .top .back { color: var(--kaya-ink); font-weight: 500; }
:root .top .back:hover { background: color-mix(in srgb, var(--panel) 35%, var(--kaya)); }
:root .top .sub { color: var(--kaya-ink); font-size: 15px; }
:root .top select { border-color: var(--kaya-line); background: color-mix(in srgb, var(--panel) 80%, var(--kaya)); }
:root .tabs button { font-size: 16px; }
:root .tabs button[aria-selected="true"] { border-bottom: 3px solid var(--stone); color: var(--ink); font-weight: 700; }
:root .tabs .n { font-size: 14px; }
:root .card { border-radius: 10px; box-shadow: none; }
:root dialog { border-radius: 12px; }
:root .hint, :root .lf-drop .hint { color: var(--soft); font-size: 15px; }
:root .note small, :root pre.rules, :root .lf-cap small, :root .lf-tag, :root .lf-picked small, :root .lf-ths label, :root .lf-strip figcaption, :root .lf-media pre { font-size: 14px; }
:root .lf-kind { font: 14px/1 var(--font); }
:root .lf-cap b { font-size: 15px; }
:root .lf-item { border-radius: 10px; border-bottom-width: 2px; }
:root .lf-drop { border-color: var(--kaya-line); background: var(--panel); }
:root .scenes button { border-radius: var(--r); font-size: 15px; }
:root .controls input[type=range], :root .check input, :root .slider input, :root .lf-ths input { accent-color: var(--stone); }
:root input, :root select, :root textarea { border-radius: var(--r); }
:root .toast { border-radius: var(--r); }
@media (max-width: 600px) { :root .top h1 { font-size: 22px; } }
/* Keyboard focus: the same stone ring as the hub page. */
:root :focus-visible { outline: 2px solid var(--stone); outline-offset: 2px; }
:root input:focus-visible, :root select:focus-visible, :root textarea:focus-visible { outline: none; border-color: var(--stone); box-shadow: 0 0 0 1px var(--stone); }
/* Phone tap targets: at least 44 px tall. */
@media (max-width: 860px) { :root .btn, :root input[type=text], :root input[type=search], :root select { min-height: 44px; } }
/* ===== end Kaya look ===== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px; cursor: pointer; min-height: 38px; transition: transform .12s ease-out; }
.btn:hover { background: var(--sel); }
.btn.go { background: var(--green); color: var(--on-green); border-color: transparent; font-weight: 500; }
.btn.go:hover { filter: brightness(1.08); }
.btn.bad { color: var(--red); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.quiet { border-color: transparent; background: transparent; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.top h1 { font: 400 26px/1 "Patrick Hand", cursive; margin: 0; white-space: nowrap; }
.top .back { display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; margin-left: -6px; text-decoration: none; color: var(--soft); font-size: 15px; font-weight: 500; white-space: nowrap; border-radius: 8px; }
.top .back:hover { color: var(--ink); background: var(--sel); }
.top .sub { color: var(--soft); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; max-width: 1200px; margin: 0 auto; padding: 10px 16px 0; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--soft); border-bottom: 2px solid transparent; white-space: nowrap; min-height: 44px; font-size: 15px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.tabs .n { font-size: 13px; font-weight: 400; color: var(--soft); background: var(--chip); border-radius: 99px; padding: 1px 7px; margin-left: 6px; }
.tabs .n:empty { display: none; }
.pane { max-width: 1200px; margin: 0 auto; padding: 12px 16px 32px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hint { color: var(--soft); font-size: 13px; margin: 8px 0 0; }
.empty { color: var(--soft); font-size: 15px; padding: 18px 4px; }
.empty .btn { margin-left: 6px; }
.check { display: inline-flex; gap: 7px; align-items: center; font-size: 14px; color: var(--soft); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--green); }
textarea, input[type=text], input[type=search], select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; min-height: 40px; }
textarea { width: 100%; resize: vertical; min-height: 70px; }
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); padding: 18px; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h2 { margin: 0 0 6px; font: 400 26px/1.1 "Patrick Hand", cursive; overflow-wrap: anywhere; }
dialog label.f { display: block; font-size: 14px; color: var(--soft); margin: 12px 0 4px; }
dialog input[type=text], dialog select { width: 100%; }
.login { max-width: 360px; margin: 18vh auto 0; padding: 22px; text-align: center; }
.login input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; margin: 12px 0; min-height: 42px; }
.err { color: var(--red); font-size: 14px; min-height: 1.2em; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100vw - 32px); }
.toast:empty { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 600px) { .top { padding-left: 10px; padding-right: 10px; } .top h1 { font-size: 24px; } .top .sub { display: none; } .tabs { padding: 4px 10px 0; } .tabs button { flex: 1; padding: 10px 6px; } .pane { padding: 12px 12px 32px; } }
/* press: instant on touch-down, eases back on release */
button, a, summary, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.btn:active:not(:disabled), .tabs button:active { transform: translateY(1px); transition-duration: 0s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; } }
</style>
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <a class="back" href="/" title="Back to the hub"><i data-ico="chevron-left" data-size="16"></i>Hub</a>
    <h1>Library</h1>
    <span class="sub">What every agent can read</span>
    <span class="spacer"></span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Library">
    <button role="tab" aria-selected="true" data-tab="files">Files<span class="n" data-n="files"></span></button>
    <button role="tab" aria-selected="false" data-tab="repos">Repos<span class="n" data-n="repos"></span></button>
    <button role="tab" aria-selected="false" data-tab="skills">Skills<span class="n" data-n="skills"></span></button>
  </nav>
  <main>
    <section class="pane" data-pane="files"></section>
    <section class="pane" data-pane="repos" hidden></section>
    <section class="pane" data-pane="skills" hidden></section>
  </main>
</div>
<div id="loginBox" class="card login" hidden>
  <h1 style="font:700 28px/1.1 var(--font);margin:0 0 4px">Library</h1>
  <form id="loginForm"><input type="password" id="pw" placeholder="Hub password" autocomplete="current-password" aria-label="Hub password"><button class="btn go" style="width:100%">Open</button></form>
  <div class="err" id="loginErr"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// Show the page (or the login) at once, and start fetching the tab that will open, before the main module runs.
// The first API reads start here too, so they run while the modules download (api() picks them up once).
window.hubBoot = {};
try {
  const pw = localStorage.getItem('hubpw');
  document.getElementById(pw ? 'app' : 'loginBox').hidden = false;
  const tab = location.hash.slice(1) || localStorage.getItem('library-tab') || 'files';
  for (const f of tab === 'repos' ? ['repos'] : tab === 'skills' ? ['skills'] : ['files']) document.head.appendChild(Object.assign(document.createElement('link'), { rel: 'modulepreload', href: `/library/${f}.js` }));
  const get = (q) => (hubBoot[q] = fetch(`/api/hub?op=${q}`, { headers: { 'x-hub-password': pw, 'content-type': 'application/json' } })
    .then(async (res) => ({ status: res.status, ok: res.ok, j: await res.json().catch(() => ({})) }), () => null));
  if (pw) { get('state&limit=1'); if (tab !== 'repos' && tab !== 'skills') get('lib-list'); }
} catch {}
</script>

<script src="ui/icons.js"></script>
<script type="module">
// The page is a shell: each tab is its own module in /library/ with
// `export function mount(el, ctx)`, loaded the first time the tab opens.
const $ = (id) => document.getElementById(id);
const ls = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let toastTimer = 0;
const toast = (msg) => { $('toast').textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($('toast').textContent = ''), 3600); };

let pw = ls.get('hubpw') || '';
async function api(op, body, query = '') {
  let res, pre = null;
  // A read the page already started before this module ran (see the script after the toast); used once.
  const early = !body && window.hubBoot?.[op + query];
  if (early) { delete window.hubBoot[op + query]; pre = await early; }
  if (pre) res = pre;
  else try {
    res = await fetch(`/api/hub?op=${op}${query}`, { method: body ? 'POST' : 'GET', headers: { 'x-hub-password': pw, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw new Error('no connection to the hub; check the network and try again');
  }
  const j = pre ? pre.j : await res.json().catch(() => ({}));
  if (res.status === 401) { showLogin('Wrong password.'); throw new Error('Wrong password.'); }
  if (!res.ok) throw new Error(j.error || `Error ${res.status}`);
  return j;
}

// Open threads, so files, repos and skills can be pointed at one.
const threads = [];
async function loadThreads() {
  const s = await api('state', null, '&limit=1');
  threads.splice(0, threads.length, ...(s.threads || []).filter((t) => !t.archived && t.status !== 'done').map((t) => ({ id: t.id, title: t.title, status: t.status })).sort((a, b) => b.id - a.id));
}
// Each tab reports how many items it has, shown next to its name.
const count = (tab, n) => { const b = document.querySelector(`[data-n="${tab}"]`); if (b) b.textContent = n ? String(n) : ''; };
const ctx = { api, toast, threads, esc, count };

const TABS = ['files', 'repos', 'skills'];
let threadsReady = Promise.resolve();
const mounted = {};
async function show(tab) {
  if (!TABS.includes(tab)) tab = 'files';
  for (const b of document.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  for (const p of document.querySelectorAll('[data-pane]')) p.hidden = p.dataset.pane !== tab;
  ls.set('library-tab', tab);
  if (location.hash !== `#${tab}`) history.replaceState(null, '', `#${tab}`);
  if (mounted[tab]) return mounted[tab].show?.();
  const el = document.querySelector(`[data-pane="${tab}"]`);
  mounted[tab] = {};
  try {
    const mod = await import(`./library/${tab}.js`);
    if (tab === 'repos') await threadsReady; // repos draws the open threads as it mounts; files reads them later, on upload or edit
    mounted[tab] = (await mod.mount(el, ctx)) || {};
  } catch (e) {
    console.error(e);
    delete mounted[tab];
    el.innerHTML = `<p class="empty">This tab could not load (${esc(e.message)}). Reload to try again.</p>`;
  }
}
for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => show(b.dataset.tab);
addEventListener('hashchange', () => show(location.hash.slice(1)));

function showLogin(err = '') { $('app').hidden = true; $('loginBox').hidden = false; $('loginErr').textContent = err; $('pw').focus(); }
$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  pw = $('pw').value;
  try { await loadThreads(); ls.set('hubpw', pw); start(); } catch (err) { $('loginErr').textContent = err.message; }
};
let started = false;
async function start() {
  $('loginBox').hidden = true; $('app').hidden = false;
  if (started) return;
  started = true;
  // The tab's module downloads while the threads load (in parallel, not one after the other).
  if (!threads.length) threadsReady = loadThreads().catch(() => {});
  show(location.hash.slice(1) || ls.get('library-tab') || 'files');
  setInterval(() => { if (!document.hidden) loadThreads().catch(() => {}); }, 60000);
}
if (pw) start(); else showLogin();
</script>
</body>
</html>
