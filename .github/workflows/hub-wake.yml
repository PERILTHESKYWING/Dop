# Pings the Dop hub so threads continue on their own once an account's usage
# limit resets, even with every hub page closed. A backstop: GitHub runs
# schedules late or drops them (every 2.5-5 h on 2026-10-21/22), so the hub's
# timed wake (QStash, see hub/lib/wake-timer.js) is what makes it prompt.
# Off the hour, which GitHub says is its busiest time.
# Needs one repository variable: HUB_URL = the hub's main address
# (Settings › Secrets and variables › Actions › Variables). Without it, it skips.
# Free: the repo is public, and each run is one curl of a few seconds.
name: Hub wake
on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash scripts/ci/step.sh {0}

jobs:
  wake:
    if: ${{ vars.HUB_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # No checkout here (one curl), so the plain shell instead of scripts/ci/step.sh.
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Wake the hub
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: curl -fsS -m 60 "${HUB_URL%/}/api/hub?op=tick" || echo "hub did not answer"
