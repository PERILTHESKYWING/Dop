}
// 1D periodic noise helper on a circle (for angular patterns)
function angNoise(theta, freq, s) {

}

// ------------------------------------------------------------------ colour
function s2l(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

}
function linToOklab(r, g, b) {

  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);

          -0.0041960863 * l3 - 0.7034186147 * m3 + 1.7076147010 * s3];

// Colour ramp LUT, interpolated in OKLab and softened (no Mach bands at stops).

// ------------------------------------------------------------------ presets
const PRESETS = {
  landscape: {
    seed: 20260925, unit: 'h', unitScale: 1,
    horizon: 0.585, sunX: 0.292, sunAlt: 0.075, sunR: 0.012,
    treeX: 0.405, treeDrop: 0.006, treeH: 0.215, treeW: 0.32,

    shadowToX: 0.75, calmRight: 0, grassDensity: 1.35, rowSpacing: 0.36,
  },

function makeScene(W, H, name, over) {
  const P = Object.assign({}, PRESETS[name], over || {});
  const U = (P.unit === 'w' ? W : H) * P.unitScale;
  const S = { P, W, H, U, seed: P.seed };

// ------------------------------------------------------------------ sky

    d[j] = Math.round(clamp(l2s(r), 0, 1) * 255); d[j + 1] = Math.round(clamp(l2s(g), 0, 1) * 255); d[j + 2] = Math.round(clamp(l2s(b), 0, 1) * 255);
    d[j + 3] = Math.round(clamp(a * P.alpha * (0.8 + 0.2 * l), 0, 1) * 255);
  }

}

// ------------------------------------------------------------------ main render
function render(name, W, H, over, opts) {

  const D = cloudDensity(S); mark('cloudD');
  const TT = cloudTransmittance(S, D); mark('cloudT');
  const occ = compositeClouds(S, R, G, B, D, TT); mark('clouds');
  paintTreeline(S, R, G, B);
  paintGround(S, R, G, B);
  horizonMist(S, R, G, B); mark('ground');
  for (let y = Math.max(0, Math.floor(S.hz)); y < H; y++) for (let x = 0; x < W; x++) occ[y * W + x] = 1;

  compositeLayer(S, R, G, B, treeC, treeA);

  compositeLayer(S, R, G, B, grassC, null, true); mark('grass');

  godRays(S, R, G, B, occ, treeA); mark('rays');
  bloom(S, R, G, B); mark('bloom');
  const out = makeCanvas(W, H);

}

// ------------------------------------------------------------------ encode
function dataURLBytes(u) { const b64 = u.slice(u.indexOf(',') + 1); return Math.floor(b64.length * 3 / 4) - (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0); }

    const x = ctx2d(n); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(c, 0, 0, n.width, n.height); c = n;
  }

    const n = makeCanvas(w, h); const x = ctx2d(n); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';

return { render, renderClouds, finalize, encode, resize, PRESETS, _internal: { perlin, fbm, fbmP, makeRamp } };
})();

// Interactive preview when the page is opened directly.

  setTimeout(() => {
    const q = new URLSearchParams(location.search);
    const preset = q.get('preset') || 'landscape';
    const w = +(q.get('w') || (preset === 'tall' ? 540 : 1280)), h = +(q.get('h') || (preset === 'tall' ? 960 : 720));

    out.width = w; out.height = h; out.getContext('2d').drawImage(c, 0, 0);
    document.getElementById('info').textContent = `DOPPELGÄNGER meadow generator: ${preset} ${w}×${h} rendered in ${c.stats.times.finish} ms`;
