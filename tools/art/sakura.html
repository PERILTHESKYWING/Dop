<script>
'use strict';
/*
 * Procedural "Sakura dusk" painting: a cherry tree in full bloom on a lake shore at sunset, far
 * hills with a pagoda, petal rafts on the water. Seeded and deterministic; no external assets.
 * API (used by render-theme.mjs):
 *   ThemeArt.render(preset, width, height) -> opaque canvas   (presets: landscape, tall)
 *   ThemeArt.strip(name, width, height)    -> transparent canvas for the CSS animation ('petals', 'glints', 'mist')
 *   ThemeArt.jobs                          -> what render-theme.mjs writes to public/art/sakura/
 * Open this file directly (optionally ?preset=tall&w=540&h=960 or ?strip=petals&w=512&h=128) to preview.
 */
const ThemeArt = (() => {
const K = ArtKit;
const { clamp, mix, smoothstep, TAU, sq, mulberry32, gauss, perlin, fbm, fbm1, fbmA, ridged, hexLin, makeRamp, rampIdx, css, blur, bilin, makeCanvas, ctx2d, makeImage, compositeLayer, alphaOf } = K;

// ------------------------------------------------------------------ presets
// Positions: x as a fraction of the width, y of the height; sizes in U (the scene unit, ~ the height).
const PRESETS = {
  landscape: {
    seed: 4417, unitScale: 1,
    horizon: 0.655, sunX: 0.655, sunAlt: 0.118, sunR: 0.0155,
    pagodaX: 0.84,
    trunk: [[0.112, 1.04], [0.118, 0.93], [0.128, 0.80], [0.152, 0.70], [0.166, 0.61], [0.19, 0.545]],
    limbs: [
      [[0.19, 0.545], [0.14, 0.43], [0.07, 0.35], [-0.02, 0.30]],
      [[0.19, 0.545], [0.2, 0.40], [0.18, 0.25], [0.16, 0.08]],
      [[0.19, 0.545], [0.27, 0.45], [0.35, 0.33], [0.46, 0.2], [0.56, 0.13]],
      [[0.176, 0.6], [0.24, 0.585], [0.3, 0.52], [0.33, 0.47]],
    ],
    crown: [ // ellipses x, y, rx(U), ry(U)
      [0.02, 0.24, 0.2, 0.19], [0.13, 0.12, 0.2, 0.16], [0.27, 0.1, 0.17, 0.13], [0.42, 0.1, 0.15, 0.1],
      [0.54, 0.07, 0.1, 0.08], [0.06, 0.42, 0.12, 0.1], [0.29, 0.3, 0.1, 0.09], [0.36, 0.42, 0.06, 0.05], [0.44, 0.24, 0.06, 0.045],
    ],
    crownPts: 6000,
    bank: [[-0.02, 0.795], [0.08, 0.815], [0.2, 0.845], [0.3, 0.885], [0.38, 0.93], [0.45, 0.985], [0.5, 1.03]],
    rafts: [[0.3, 0.73, 0.75, 0.70], [0.46, 0.83, 0.9, 0.76], [0.55, 0.95, 1.05, 0.86]],
  },
  tall: {
    seed: 4417, unitScale: 0.6,
    horizon: 0.6, sunX: 0.64, sunAlt: 0.16, sunR: 0.017,
    pagodaX: 0.86,
    trunk: [[0.064, 1.03], [0.07, 0.93], [0.085, 0.84], [0.12, 0.77], [0.15, 0.7], [0.19, 0.655]],
    limbs: [
      [[0.19, 0.655], [0.12, 0.55], [0.03, 0.47], [-0.05, 0.42]],
      [[0.19, 0.655], [0.22, 0.53], [0.2, 0.38], [0.22, 0.2]],
      [[0.19, 0.655], [0.34, 0.55], [0.5, 0.43], [0.66, 0.31], [0.8, 0.2]],
      [[0.21, 0.4], [0.35, 0.3], [0.5, 0.2], [0.62, 0.1]],
    ],
    crown: [
      [0.05, 0.3, 0.26, 0.2], [0.25, 0.16, 0.26, 0.18], [0.5, 0.12, 0.24, 0.13], [0.78, 0.13, 0.17, 0.1],
      [0.08, 0.5, 0.17, 0.12], [0.4, 0.33, 0.16, 0.1], [0.6, 0.35, 0.1, 0.06], [0.95, 0.08, 0.1, 0.08], [0.5, 0.26, 0.08, 0.06], [0.66, 0.22, 0.08, 0.05],
    ],
    crownPts: 5600,
    bank: [[-0.02, 0.815], [0.15, 0.835], [0.35, 0.87], [0.52, 0.915], [0.68, 0.97], [0.78, 1.03]],
    rafts: [[0.35, 0.7, 0.95, 0.66], [0.5, 0.8, 1.05, 0.73], [0.62, 0.9, 1.1, 0.86]],
  },
};

function makeScene(name, W, H) {
  const P = PRESETS[name];
  const U = H * P.unitScale * (name === 'tall' ? 1 : 1);
  const S = { P, W, H, U, seed: P.seed, name };
  S.hz = P.horizon * H;
  S.sunX = P.sunX * W; S.sunY = S.hz - P.sunAlt * U; S.sunR = P.sunR * U;
  S.img = makeImage(W, H);
  S.pal = palettes();
  return S;
}

function palettes() {
  return {
    skyWarm: makeRamp([[0.0, '#ffe7b8'], [0.05, '#ffcf9e'], [0.12, '#ffb09a'], [0.22, '#f593a6'], [0.36, '#d985b4'], [0.52, '#a97fbc'], [0.7, '#7a76b6'], [0.86, '#555c9f'], [1.0, '#3a4284']]),
    skyCool: makeRamp([[0.0, '#f9cdb9'], [0.07, '#f2b0b1'], [0.17, '#e095b4'], [0.32, '#b886ba'], [0.5, '#8b7bb8'], [0.7, '#6468aa'], [0.86, '#4b5394'], [1.0, '#333b78']]),
    cloudSun: makeRamp([[0.0, '#fff1c8', 2.6], [0.1, '#ffc486', 2.0], [0.3, '#ff9a8a', 1.55], [0.6, '#f784a8', 1.3], [1.0, '#dc7cb4', 1.1], [1.6, '#b67ac0', 0.95]]),
    ambTop: makeRamp([[0.0, '#b27a9c'], [0.3, '#8e6c9e'], [0.6, '#6c5f98'], [1.0, '#4a4a84']]),
    blossom: ['#fff0f4', '#fde2ea', '#f9cbd9', '#f5b3c9', '#ee9dbb', '#e486aa'],
  };
}

// ------------------------------------------------------------------ sky
function skyWarm(S, x, y) {
  const wob = 0.06 * perlin(x / S.U * 1.3, y / S.U * 1.3, S.seed + 11);
  return Math.exp(-sq((x - S.sunX) / S.W / (0.42 + wob)));
}
function paintSky(S) {
  const { W, H, U, hz, sunX, sunY, sunR } = S, { R, G, B } = S.img;
  const Lw = S.pal.skyWarm, Lc = S.pal.skyCool, n1 = Lw.n - 1;
  const hzI = Math.min(H, Math.ceil(hz) + 2);
  for (let y = 0; y < hzI; y++) {
    const tS = clamp((hz - y) / hz, 0, 1);
    const li = (tS * n1) | 0;
    const e = Math.max(0, (hz - y) / U);
    const hg = Math.exp(-e / 0.03) + 0.35 * Math.exp(-e / 0.1);
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const wl = skyWarm(S, x, y);
      let r = Lc.r[li] + (Lw.r[li] - Lc.r[li]) * wl;
      let g = Lc.g[li] + (Lw.g[li] - Lc.g[li]) * wl;
      let b = Lc.b[li] + (Lw.b[li] - Lc.b[li]) * wl;
      const lv = 1 + 0.05 * perlin(x / U * 1.8 + 5.1, y / U * 1.8, S.seed + 21);
      r *= lv; g *= lv; b *= lv;
      const hx = Math.exp(-Math.abs(x - sunX) / (0.3 * W));
      const hgi = hg * (0.12 + 0.75 * hx);
      r += hgi * 0.9; g += hgi * 0.55; b += hgi * 0.35;
      const dx = (x - sunX) / U, dy = (y - sunY) / U, d = Math.sqrt(dx * dx + dy * dy);
      const a1 = Math.exp(-d / 0.012), a2 = Math.exp(-d / 0.045), a3 = Math.exp(-d / 0.15);
      r += 4.2 * a1 + 1.5 * a2 + 0.55 * a3;
      g += 3.4 * a1 + 0.85 * a2 + 0.26 * a3;
      b += 2.0 * a1 + 0.35 * a2 + 0.12 * a3;
      const dd = d * U;
      if (dd < sunR + 2) {
        const k = clamp(sunR + 0.5 - dd, 0, 1);
        const limb = 1 - 0.35 * sq(dd / sunR);
        r += 28 * k * limb; g += 24 * k * limb; b += 17 * k * limb;
      }
      R[i] = r; G[i] = g; B[i] = b;
    }
  }
}

// ------------------------------------------------------------------ clouds (perspective sky plane)
function cloudCoverage(S, x, y) {
  const { W, U, hz, sunX, sunY } = S;
  const tS = clamp((hz - y) / hz, 0, 1);
  const ur = (x - sunX) / W;
  const d = Math.hypot((x - sunX) / U, (y - sunY) / U);
  let c = -0.1;
  c += 0.2 * smoothstep(0.42, 0.95, tS);
  c += 0.16 * Math.exp(-sq((tS - 0.5) / 0.14)) * (0.4 + 0.6 * smoothstep(-0.5, 0.2, -Math.abs(ur + 0.1)));
  c += 0.05 * Math.exp(-sq((tS - 0.16) / 0.05));
  c -= 0.38 * Math.exp(-sq(d / 0.16));
  c -= 0.3 * smoothstep(0.08, 0.0, tS);
  return c;
}
function cloudDensity(S) {
  const { W, H, U, hz } = S;
  const D = new Float32Array(W * H), Hf = new Float32Array(W * H);
  const s = S.seed + 101;
  const hzI = Math.min(H, Math.ceil(hz));
  for (let y = 0; y < hzI; y++) {
    const e = (hz - y) / U, ez = e + 0.035, pz = 1 / ez;
    const foot = 1 / (ez * ez * U), fq = 1.2;
    const octB = clamp(1 + Math.log2(0.3 / (foot * fq)), 1, 4);
    const octD = clamp(1 + Math.log2(0.3 / (foot * fq * 5)), 0, 4);
    const fade = smoothstep(0.0, 0.04, e);
    for (let x = 0; x < W; x++) {
      const px = (x - W * 0.5) / U * pz;
      let qx = px * 0.45 * fq, qz = pz * fq * 1.3;
      const wx = fbm(qx * 0.3 + 3.1, qz * 0.3 - 1.7, 2, s + 1, 0.5);
      const wz = fbm(qx * 0.3 - 7.3, qz * 0.3 + 4.2, 2, s + 2, 0.5);
      qx += 0.8 * wx; qz += 0.45 * wz;
      const base = fbm(qx, qz, octB, s + 3, 0.55);
      const det = octD > 0 ? fbm(qx * 4.1, qz * 4.1, octD, s + 4, 0.5) : 0;
      const c = cloudCoverage(S, x, y);
      let v = (base + c) * 3.2 + det * 0.9;
      Hf[y * W + x] = v;
      v = v <= 0 ? 0 : v >= 1 ? 1 : v;
      D[y * W + x] = v * v * (3 - 2 * v) * fade;
    }
  }
  D.Hf = Hf;
  return D;
}
function cloudLight(S, D) {
  const f = 2, { W, H, U, sunX, sunY } = S;
  const ds = K.downsample(D, W, H, f), Dh = ds.buf, w = ds.w, h = ds.h;
  const T = new Float32Array(w * h);
  const sx = sunX / f, sy = sunY / f, step = 0.008 * U / f, steps = 12, kappa = 0.22;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (Dh[i] <= 0.0005) { T[i] = 1; continue; }
    let lx = sx - x, ly = sy - y; const L = Math.hypot(lx, ly) + 1e-6; lx /= L; ly /= L;
    const n = Math.min(steps, Math.floor(L / step));
    let acc = 0;
    for (let k = 1; k <= n; k++) acc += bilin(Dh, w, h, x + lx * step * k, y + ly * step * k);
    T[i] = Math.exp(-acc * kappa);
  }
  return { T, w, h };
}
function compositeClouds(S, D, TT) {
  const { W, H, U, hz, sunX, sunY } = S, { R, G, B } = S.img;
  const cs = S.pal.cloudSun, at = S.pal.ambTop;
  const occ = new Float32Array(W * H);
  const hzI = Math.min(H, Math.ceil(hz));
  const Hf = D.Hf;
  for (let y = 0; y < hzI; y++) {
    const tS = clamp((hz - y) / hz, 0, 1);
    const ai = rampIdx(at, tS);
    for (let x = 0; x < W; x++) {
      const i = y * W + x, dv = D[i];
      if (dv <= 0.001) continue;
      const a = 1 - Math.exp(-dv * 3.0);
      const T = bilin(TT.T, TT.w, TT.h, x / 2, y / 2);
      const d = Math.hypot((x - sunX) / U, (y - sunY) / U);
      const ci = rampIdx(cs, d);
      const phase = 0.7 + 1.1 * Math.exp(-d / 0.22) + 2.2 * Math.exp(-d / 0.06);
      const thin = Math.exp(-dv * 2.2);
      const xa = x > 1 ? i - 2 : i, xb = x < W - 2 ? i + 2 : i, ya = y > 1 ? i - 2 * W : i, yb = y < hzI - 2 ? i + 2 * W : i;
      const gx = (Hf[xb] - Hf[xa]) * U / 4, gy = (Hf[yb] - Hf[ya]) * U / 4;
      const ll = Math.max(1e-6, d * U);
      const bump = clamp(0.5 - 0.012 * (gx * (sunX - x) + gy * (sunY - y)) / ll, 0, 1.7);
      const lit = Math.pow(T, 1.15) * phase * (0.4 + 0.6 * thin) * (0.3 + 0.7 * bump) + thin * (1 - thin) * 3 * Math.exp(-d / 0.14) * 1.4;
      const shade = (1.0 - 0.45 * dv) * (0.72 + 0.3 * bump);
      const wl = skyWarm(S, x, y);
      const amb = 0.9 + 0.25 * wl;
      const cr = at.r[ai] * shade * amb + cs.r[ci] * lit, cg = at.g[ai] * shade * amb + cs.g[ci] * lit, cb = at.b[ai] * shade * amb + cs.b[ci] * lit;
      R[i] = R[i] * (1 - a) + cr * a;
      G[i] = G[i] * (1 - a) + cg * a;
      B[i] = B[i] * (1 - a) + cb * a;
      occ[i] = a;
    }
  }
  return occ;
}

// ------------------------------------------------------------------ hills, pagoda
function ridgeHeights(S, L) {
  const { W, U, sunX } = S;
  const h = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    const u = x / U;
    let v = L.base + L.amp * (0.55 + 0.45 * fbm1(u * L.freq + L.off, 5, S.seed + L.s, 0.5));
    v += L.peak * Math.pow(K.ridged(u * L.freq * 0.7 + L.off, 0.5, 4, S.seed + L.s + 7, 0.5), 2.2 * (L.sharp || 1));
    v *= 1 - L.gap * Math.exp(-sq((x - sunX) / (0.13 * W)));
    if (L.bumps) for (const [bx, bh, bw] of L.bumps) v += bh * Math.exp(-sq((x - bx * W) / (bw * U)));
    if (L.fine) v += L.fine * (0.6 * perlin(u * 90, 0.5, S.seed + L.s + 3) + 0.4 * perlin(u * 260, 1.5, S.seed + L.s + 4));
    h[x] = Math.max(0, v) * U;
  }
  return h;
}
function paintHills(S) {
  const { W, H, U, hz, sunX, sunY } = S, { R, G, B } = S.img;
  const layers = [
    { s: 301, base: 0.035, amp: 0.05, peak: 0.13, freq: 1.25, off: 0.3, gap: 0.45, col: '#8f70a0', dens: 0.72, haze: 0.02, sharp: 1.4, fine: 0.0016, rav: 0.1 },
    { s: 331, base: 0.018, amp: 0.035, peak: 0.05, freq: 2.2, off: 4.1, gap: 0.3, col: '#5f4b7a', dens: 0.85, haze: 0.014, sharp: 1.7, fine: 0.0016, rav: 0.14 },
    { s: 361, base: 0.007, amp: 0.02, peak: 0.006, freq: 4.2, off: 9.7, gap: 0.1, col: '#2f2641', dens: 0.97, haze: 0.009, fine: 0.0022,
      bumps: [[S.P.pagodaX, 0.012, 0.05]] },
  ];
  const out = [];
  for (const L of layers) {
    const h = ridgeHeights(S, L);
    const c = hexLin(L.col);
    const maxH = Math.max(...h);
    for (let y = Math.max(0, Math.floor(hz - maxH - 1)); y <= Math.min(H - 1, Math.ceil(hz)); y++) {
      const up = (hz - y) / U;
      for (let x = 0; x < W; x++) {
        const cov = clamp(y - (hz - h[x]) + 0.5, 0, 1);
        if (cov <= 0) continue;
        const i = y * W + x;
        const near = Math.exp(-Math.abs(x - sunX) / (0.22 * W));
        const foot = Math.exp(-up / L.haze);                                  // mist at the foot of each range
        const tex = L.rav ? 1 + L.rav * fbm(x / U * 40, y / U * 6, 3, S.seed + L.s + 9, 0.55) : L.fine ? 1 + 0.2 * fbm(x / U * 60, y / U * 60, 3, S.seed + L.s + 9, 0.55) : 1;
        let dens = L.dens * (1 - 0.3 * near) * (1 - 0.5 * foot);
        const lum = (1 + 0.5 * near * (1 - L.dens * 0.6)) * tex;
        const k = cov * dens;
        const below = (y - (hz - h[x])) / U;
        const rimk = Math.exp(-below / 0.0025) * Math.exp(-Math.abs(x - sunX) / (0.12 * W)) * 0.8;
        R[i] = mix(R[i], c[0] * lum, k) + rimk * 0.9; G[i] = mix(G[i], c[1] * lum, k) + rimk * 0.55; B[i] = mix(B[i], c[2] * lum, k) + rimk * 0.35;
      }
    }
    out.push(h);
  }
  return out;
}
// Distant blossoming trees on the near hills: soft pink clumps.
function hillBlossoms(S, h3) {
  const { W, U, hz, sunX } = S, { R, G, B } = S.img;
  const rng = mulberry32(S.seed + 377);
  const c = hexLin('#e7a9c3');
  for (let k = 0; k < 520; k++) {
    const x = rng() * W, xi = x | 0;
    if (Math.abs(x - S.P.pagodaX * W) < 0.03 * U) continue;
    const top = hz - h3[xi];
    const y = top + rng() * (hz - top) * 0.8 + 0.002 * U;
    const r = U * (0.0015 + 0.003 * rng());
    const near = Math.exp(-Math.abs(x - sunX) / (0.2 * W));
    const a0 = 0.35 + 0.35 * rng();
    for (let yy = Math.floor(y - r); yy <= Math.ceil(y + r * 0.7); yy++) for (let xx = Math.floor(x - r * 1.4); xx <= Math.ceil(x + r * 1.4); xx++) {
      if (xx < 0 || xx >= W || yy > hz || yy < 0) continue;
      const q = sq((xx - x) / (r * 1.4)) + sq((yy - y) / r);
      if (q > 1) continue;
      const i = yy * W + xx, a = a0 * (1 - q) * (1 - 0.5 * near);
      R[i] = mix(R[i], c[0] * 0.55, a); G[i] = mix(G[i], c[1] * 0.5, a); B[i] = mix(B[i], c[2] * 0.6, a);
    }
  }
}
function drawPagoda(S, ctx, h3) {
  const { W, U, hz } = S;
  const x0 = S.P.pagodaX * W, base = hz - h3[Math.round(x0)] + 0.002 * U;
  const tiers = 5, H0 = 0.056 * U, w0 = 0.019 * U;
  ctx.fillStyle = '#000';
  let y = base;
  const tierH = H0 * 0.78 / tiers;
  for (let t = 0; t < tiers; t++) {
    const w = w0 * (1 - t * 0.12), ww = w * 1.55;
    const bodyH = tierH * 0.52;
    ctx.fillRect(x0 - w * 0.42, y - bodyH, w * 0.84, bodyH + 1);
    y -= bodyH;
    // roof with upturned eaves
    const rt = tierH * 0.48;
    ctx.beginPath();
    ctx.moveTo(x0 - ww / 2, y - rt * 0.55);
    ctx.quadraticCurveTo(x0 - ww * 0.3, y - rt * 0.05, x0 - w * 0.36, y + rt * 0.05);
    ctx.lineTo(x0 + w * 0.36, y + rt * 0.05);
    ctx.quadraticCurveTo(x0 + ww * 0.3, y - rt * 0.05, x0 + ww / 2, y - rt * 0.55);
    ctx.quadraticCurveTo(x0 + ww * 0.2, y - rt * 0.45, x0 + w * 0.12, y - rt);
    ctx.lineTo(x0 - w * 0.12, y - rt);
    ctx.quadraticCurveTo(x0 - ww * 0.2, y - rt * 0.45, x0 - ww / 2, y - rt * 0.55);
    ctx.fill();
    y -= rt * 0.92;
  }
  // spire (sōrin)
  ctx.fillRect(x0 - U * 0.0009, y - H0 * 0.24, U * 0.0018, H0 * 0.25);
  for (let k = 0; k < 6; k++) ctx.fillRect(x0 - U * 0.0022, y - H0 * (0.04 + k * 0.03), U * 0.0044, U * 0.0009);
}

// ------------------------------------------------------------------ water
function bankY(S, x) {
  const pts = S.P.bank, u = x / S.W;
  if (u <= pts[0][0]) return pts[0][1] * S.H;
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], b = pts[k + 1];
    if (u <= b[0]) { const t = (u - a[0]) / (b[0] - a[0]); const s = t * t * (3 - 2 * t); return mix(a[1], b[1], mix(t, s, 0.5)) * S.H; }
  }
  return pts[pts.length - 1][1] * S.H + (u - pts[pts.length - 1][0]) * 3 * S.H;
}
function paintWater(S) {
  const { W, H, U, hz, sunX, sunY } = S, { R, G, B } = S.img;
  const hzI = Math.floor(hz);

      ctx.moveTo(cx + Math.cos(a) * f.rf * 0.52, cy + Math.sin(a) * f.rf * 0.52);
      ctx.ellipse(cx, cy, f.rf * 0.52, f.rf * 0.42, a, 0, TAU);
    }
    ctx.fill();
    if (f.rf > 0.0028 * U) {
      ctx.fillStyle = css(f.r * 0.7, f.g * 0.42, f.b * 0.5);
      ctx.beginPath(); ctx.arc(0, 0, f.rf * 0.2, 0, TAU); ctx.fill();
    }
  };
  // branches and trunk behind the front half of the blossom
  const bark = css(0.03, 0.021, 0.027);
  const drawWood = () => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.strokeStyle = bark; ctx.fillStyle = bark; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let n = 1; n < nodes.length; n++) {
      const a = nodes[n]; if (a.p < 0) continue; const p = nodes[a.p];
      ctx.lineWidth = Math.max(0.7, a.r * 2);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(a.x, a.y); ctx.stroke();
    }
  };
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0);
  for (let x = W; x >= 0; x -= 4) ctx.lineTo(x, bankY(S, x) + 0.03 * U);
  ctx.closePath(); ctx.clip();
  let k0 = 0;
  for (; k0 < flowers.length && flowers[k0].z < -0.55; k0++) drawFlower(flowers[k0]);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(mass, 0, 0);
  for (; k0 < flowers.length && flowers[k0].z < -0.1; k0++) drawFlower(flowers[k0]);
  drawWood();
  for (; k0 < flowers.length; k0++) drawFlower(flowers[k0]);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.restore();
  return { canvas, nodes, T };
}
// Composite the tree with bark texture and a warm rim where the silhouette faces the sun.
function compositeTree(S, canvas) {
  const { W, H, U, sunX, sunY } = S, { R, G, B } = S.img;
  const d = ctx2d(canvas).getImageData(0, 0, W, H).data;
  const A = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) A[i] = d[i * 4 + 3] / 255;
  const lut = new Float32Array(256); for (let i = 0; i < 256; i++) lut[i] = K.s2l(i / 255);
  const off = Math.max(1.5, U * 0.0022);
  const rim = hexLin('#ffb38a');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, a = A[i]; if (a <= 0) continue;
    const j = i * 4;
    let r = lut[d[j]], g = lut[d[j + 1]], b = lut[d[j + 2]];
    const L = r + g + b;
    if (L < 0.2) { // bark: lenticel streaks, a soft light on the sun side and a thin warm rim
      let lx = sunX - x, ly = sunY - y; const l = Math.hypot(lx, ly); lx /= l; ly /= l;
      const n = perlin(x / U * 22, y / U * 240, S.seed + 91) + 0.5 * perlin(x / U * 90, y / U * 30, S.seed + 92);
      const bk = 1 + 0.35 * clamp(n, -1, 1);
      r *= bk; g *= bk; b *= bk;
      const e1 = clamp(1 - bilin(A, W, H, x + lx * off, y + ly * off), 0, 1);
      const e2 = clamp(1 - bilin(A, W, H, x + lx * off * 6, y + ly * off * 6), 0, 1);
      const fall = Math.exp(-l / U / 1.1);
      r += (rim[0] * e1 * 0.32 + 0.09 * e2) * fall; g += (rim[1] * e1 * 0.2 + 0.045 * e2) * fall; b += (rim[2] * e1 * 0.16 + 0.04 * e2) * fall;
    }
    R[i] = R[i] * (1 - a) + r * a; G[i] = G[i] * (1 - a) + g * a; B[i] = B[i] * (1 - a) + b * a;
  }
  return A;
}

// grass and fallen petals in front of the foot of the trunk
function drawFrontGrass(S, ctx) {
  const { W, H, U, sunX } = S;
  const rng = mulberry32(S.seed + 644);
  const tx = S.P.trunk[2][0] * W, pal = S.pal.blossom.map(hexLin);
  for (let k = 0; k < 1400; k++) {
    const x = tx + gauss(rng) * 0.05 * U, t0 = bankY(S, x);
    const y = t0 + (0.004 + Math.pow(rng(), 1.5) * 0.09) * U;
    if (y > H + 0.01 * U) continue;
    const hgt = U * (0.012 + 0.03 * rng());
    const lean = gauss(rng) * 0.3 + 0.12, w = Math.max(0.8, U * 0.0016);
    const v = 0.02 + 0.03 * rng();
    ctx.strokeStyle = css(v * 1.25, v * 1.3, v * 0.95);
    ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean * hgt * 0.3, y - hgt * 0.6, x + lean * hgt, y - hgt); ctx.stroke();
    if (rng() < 0.45) {
      ctx.strokeStyle = 'rgba(255,160,120,0.45)'; ctx.lineWidth = w * 0.45;
      ctx.beginPath(); ctx.moveTo(x + lean * hgt * 0.45 + w * 0.3, y - hgt * 0.6); ctx.quadraticCurveTo(x + lean * hgt * 0.7, y - hgt * 0.85, x + lean * hgt, y - hgt); ctx.stroke();
    }
  }
  for (let k = 0; k < 160; k++) {
    const x = tx + gauss(rng) * 0.06 * U, y = bankY(S, x) + (0.005 + rng() * 0.08) * U;
    const c = pal[(rng() * pal.length) | 0], lit = 0.25 + 0.25 * rng(), sz = U * (0.002 + 0.003 * rng());
    ctx.fillStyle = css(c[0] * lit, c[1] * lit * 0.9, c[2] * lit);
    ctx.beginPath(); ctx.ellipse(x, y, sz, sz * 0.55, rng() * Math.PI, 0, TAU); ctx.fill();
  }
}

// ------------------------------------------------------------------ air, glow
function drawAirPetals(S, ctx) {
  const { W, H, U, sunX, sunY } = S;
  const rng = mulberry32(S.seed + 919);
  const pal = S.pal.blossom.map(hexLin);
  for (let k = 0; k < 36; k++) {
    const x = rng() * W * 0.8, y = rng() * H * 0.85;
    const c = pal[(rng() * 3) | 0];
    const sz = U * (0.0025 + 0.004 * rng());
    const lit = 0.55 + 0.4 * Math.exp(-Math.hypot(x - sunX, y - sunY) / (0.5 * U));
    ctx.globalAlpha = 0.55 + 0.35 * rng();
    ctx.fillStyle = css(c[0] * lit, c[1] * lit * 0.85, c[2] * lit * 0.9);
    ctx.beginPath(); ctx.ellipse(x, y, sz, sz * (0.35 + 0.35 * rng()), rng() * Math.PI, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function frontGlow(S, treeA) {
  const { W, H, U, hz, sunX, sunY } = S, { R, G, B } = S.img;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const dx = (x - sunX) / U, dy = (y - sunY) / U * 1.25, d = Math.sqrt(dx * dx + dy * dy);
    const k = (Math.exp(-d / 0.2) * 0.32 + Math.exp(-d / 0.6) * 0.1) * (1 - 0.7 * treeA[i]);
    R[i] += k * 1.0; G[i] += k * 0.55; B[i] += k * 0.42;
    // low warm haze band at the horizon
    const hb = Math.exp(-Math.abs(y - hz) / (0.02 * U)) * (0.06 + 0.35 * Math.exp(-Math.abs(x - sunX) / (0.25 * W))) * (1 - treeA[i]);
    R[i] += hb * 0.5; G[i] += hb * 0.3; B[i] += hb * 0.22;
  }
}

// ------------------------------------------------------------------ main render
function render(name, W, H) {
  const t0 = performance.now(), times = {};
  const mark = (k) => { times[k] = Math.round(performance.now() - t0); };
  const S = makeScene(name, W, H);
  paintSky(S); mark('sky');
  const D = cloudDensity(S); const TT = cloudLight(S, D); compositeClouds(S, D, TT); mark('clouds');
  const hills = paintHills(S); mark('hills');
  hillBlossoms(S, hills[2]);
  const pc = makeCanvas(W, H), pctx = ctx2d(pc);
  drawPagoda(S, pctx, hills[2]);
  const pagA = alphaOf(pc);
  { const c = hexLin('#2f2641'), { R, G, B } = S.img;
    for (let i = 0; i < W * H; i++) { const a = pagA[i] * 0.84; if (a > 0) { R[i] = mix(R[i], c[0], a); G[i] = mix(G[i], c[1], a); B[i] = mix(B[i], c[2], a); } } }
  mark('pagoda');
  paintWater(S); mark('water');
  const rc = makeCanvas(W, H); drawRafts(S, ctx2d(rc)); compositeLayer(S.img, rc); mark('rafts');
  const top = paintBank(S);
  const bc = makeCanvas(W, H); drawBankDetail(S, ctx2d(bc), top); compositeLayer(S.img, bc); mark('bank');
  const tree = drawTree(S); mark('treeDraw');
  const treeA = compositeTree(S, tree.canvas); mark('tree');
  const fg = makeCanvas(W, H); drawFrontGrass(S, ctx2d(fg)); compositeLayer(S.img, fg);
  const ac = makeCanvas(W, H); drawAirPetals(S, ctx2d(ac)); compositeLayer(S.img, ac);
  frontGlow(S, treeA); mark('glow');
  K.bloom(S.img, S.U, { threshold: 1.1, amount: 0.9 }); mark('bloom');
  const out = K.finish(S.img, S.seed, { saturation: 1.06, vignette: 0.28, vignetteTint: [0.9, 1, 0.8], knee: 0.68 });
  mark('finish');
  out.stats = { times };
  return out;
}

// ------------------------------------------------------------------ strips for the CSS animation
// 'petals': eight notched cherry petals in a row (square cells), for the falling petals.
function petalSheet(W, H) {
  const c = makeCanvas(W, H), ctx = ctx2d(c);
  const n = Math.round(W / H), s = H, rng = mulberry32(77);
  for (let k = 0; k < n; k++) {
    ctx.save();
    ctx.translate(k * s + s / 2, s / 2);
    ctx.rotate(-0.6 + rng() * 1.2);
    const L = s * 0.4, Wd = s * (0.2 + 0.05 * rng());
    const grad = ctx.createLinearGradient(0, L, 0, -L);
    const deep = k % 3 === 2;
    grad.addColorStop(0, deep ? '#e889ab' : '#f1a7c0');
    grad.addColorStop(0.45, deep ? '#f6bfd2' : '#fbd5e2');
    grad.addColorStop(1, '#fff3f6');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, L);
    ctx.bezierCurveTo(Wd * 1.3, L * 0.5, Wd * 1.25, -L * 0.7, Wd * 0.28, -L);
    ctx.lineTo(0, -L * 0.8);            // the notch at the tip
    ctx.lineTo(-Wd * 0.28, -L);
    ctx.bezierCurveTo(-Wd * 1.25, -L * 0.7, -Wd * 1.3, L * 0.5, 0, L);
    ctx.fill();
    ctx.strokeStyle = 'rgba(214, 110, 150, 0.35)'; ctx.lineWidth = Math.max(1, s * 0.012);
    ctx.beginPath(); ctx.moveTo(0, L * 0.9); ctx.quadraticCurveTo(Wd * 0.1, 0, 0, -L * 0.7); ctx.stroke();
    ctx.restore();
  }
  return c;
}
// 'glints': two frames side by side of sparkles on the sun's path. Each frame spans the lane from the
// horizon (top) to the bottom of the painting; the CSS cross-fades the two frames so the water twinkles.
function glintSheet(W, H) {
  const c = makeCanvas(W, H), ctx = ctx2d(c);
  const fw = W / 2;
  for (let f = 0; f < 2; f++) {
    const rng = mulberry32(900 + f * 17);
    for (let k = 0; k < 520; k++) {
      const v = Math.pow(rng(), 1.25);
      const half = 0.5 * (0.05 + 0.95 * v);
      const u = 0.5 + gauss(rng) * half * 0.42;
      if (u < 0.01 || u > 0.99) continue;
      const x = f * fw + u * fw, y = 2 + v * (H - 4);
      const len = (1.5 + 9 * v) * (0.5 + rng()), th = Math.max(0.6, (0.6 + 1.6 * v) * (0.6 + 0.6 * rng()));
      const a = (0.35 + 0.65 * rng()) * (1 - 0.5 * Math.abs(u - 0.5) / Math.max(0.05, half));
      const g = ctx.createRadialGradient(x, y, 0, x, y, len);
      g.addColorStop(0, `rgba(255,246,222,${a.toFixed(3)})`);
      g.addColorStop(0.35, `rgba(255,214,170,${(a * 0.55).toFixed(3)})`);
      g.addColorStop(1, 'rgba(255,190,150,0)');
      ctx.fillStyle = g;
      ctx.save(); ctx.translate(x, y); ctx.scale(1, th / len); ctx.translate(-x, -y);
      ctx.beginPath(); ctx.arc(x, y, len, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  return c;
}
// 'mist': a soft band of haze that tiles sideways, to drift along the far shore.
function mistStrip(W, H) {
  const A = new Float32Array(W * H), R = new Float32Array(W * H), G = new Float32Array(W * H), B = new Float32Array(W * H);
  const cells = 6, s = 4417 + 950, col = hexLin('#ffe3e6');
  for (let y = 0; y < H; y++) {
    const v = y / H, env = Math.exp(-sq((v - 0.5) / 0.22));
    for (let x = 0; x < W; x++) {
      const nx = x / W * cells, ny = v * 1.3;
      const n = K.fbmP(nx, ny, 5, s, 0.55, cells);
      const i = y * W + x;
      A[i] = clamp((n + 0.15) * 1.6, 0, 1) * env * 0.75;
      R[i] = col[0]; G[i] = col[1]; B[i] = col[2];
    }
  }
  return K.finishRGBA(W, H, R, G, B, A, 5);
}
function strip(name, W, H) {
  if (name === 'petals') return petalSheet(W, H);
  if (name === 'glints') return glintSheet(W, H);
  if (name === 'mist') return mistStrip(W, H);
  throw new Error('unknown strip ' + name);
}

const jobs = {
  landscape: {
    kind: 'scene', preset: 'landscape', w: 2560, h: 1440,
    outputs: [
      { file: 'sakura.webp', maxBytes: 440_000 },
      { file: 'sakura-1280.webp', w: 1280, h: 720, maxBytes: 155_000 },
      { file: 'thumb.webp', w: 480, h: 270, maxBytes: 26_000, kind: 'thumb' },
    ],
  },
  tall: { kind: 'scene', preset: 'tall', w: 1080, h: 1920, outputs: [{ file: 'sakura-tall.webp', maxBytes: 310_000 }] },
  petals: { kind: 'strip', strip: 'petals', w: 512, h: 64, outputs: [{ file: 'petals.webp', maxBytes: 20_000 }] },
  glints: { kind: 'strip', strip: 'glints', w: 1280, h: 360, outputs: [{ file: 'glints.webp', maxBytes: 40_000 }] },
  mist: { kind: 'strip', strip: 'mist', w: 1024, h: 64, outputs: [{ file: 'mist.webp', maxBytes: 16_000 }] },
};

return { render, strip, jobs, PRESETS };
